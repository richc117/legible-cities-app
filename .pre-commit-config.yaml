# Local git hooks. Install them once per checkout:
#
#   pip install pre-commit   (or: brew install pre-commit)
#   pre-commit install
#
# After that `git commit` runs gitleaks over the staged changes,
# bin/preflight over the staged tree and the message being written, and
# shellcheck over the shell. The two scanners run again in CI
# (.github/workflows/gitleaks.yml and preflight.yml), so a bypassed hook is
# caught rather than trusted.
#
# The gitleaks version is pinned by `rev`; pre-commit builds it in its own
# environment, so nothing needs to be installed for it. Update the pin with
# `pre-commit autoupdate` and read the changelog before committing the bump.

default_install_hook_types: [pre-commit, commit-msg]
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # A conflict marker committed during a rebase. Nothing else here would
      # see one: `npm run lint` runs prettier over src, tests and scripts
      # only, so a marker left in a document under docs/ reached a pull
      # request with git's own scaffolding in it, commit hash included.
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Keys, tokens and certificates in the staged changes. The allowlist
      # for this repository's false positives is in .gitleaks.toml. Pinned to
      # the commit stage: with `commit-msg` also installed it would otherwise
      # scan the same staged changes twice.
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      # The hooks and bin/preflight are the only executable code here, and
      # they are what the repository's hygiene rests on. A wheel, so it needs
      # no Docker and no separate shellcheck install.
      #
      # .specify/ is Spec Kit's own, regenerated by `specify init`; fixing
      # its findings would be undone by the next refresh, and they are not
      # ours to fix. Checking it would train us to ignore the hook.
      - id: shellcheck
        exclude: '^\.specify/'

  - repo: local
    hooks:
      # The rest of the never list, which no secret scanner knows about:
      # machine paths, personal addresses, private hosts, session links.
      - id: preflight
        name: preflight (paths, addresses, keys, session links)
        entry: bin/preflight
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: preflight-commit-message
        name: preflight (the commit message)
        entry: bin/preflight --message-file
        language: script
        stages: [commit-msg]

      # The two Claude Code hooks decide whether a command is allowed to
      # run, and shellcheck cannot tell you that an option pattern assuming
      # spaces misses `-r=file`. Every case in here is a bug that shipped
      # or a legitimate command that a fix for one broke. They are committed
      # again as of ADR-029, so this can run again.
      - id: hook-tables
        name: the assistant's allow and refuse tables
        entry: bin/test-hooks
        language: script
        pass_filenames: false
        files: '^(\.claude/hooks/|bin/test-hooks$)'
        stages: [pre-commit]
