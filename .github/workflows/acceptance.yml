# The acceptance checklist (docs/acceptance.md, A6-04) over a published
# Release's own installers, on GitHub's macOS and Windows runners: download
# and check the installer (step 1), install it (step 2), drive the installed
# app through steps 3 to 20 with tests/acceptance/acceptance.spec.ts,
# uninstall it and look for what is left (step 21), and then make the update
# over 0.1.0 (step 22) with tests/acceptance/upgrade.spec.ts: 0.1.0 from its
# own Release, a project and an export made in it, the release under test
# installed over it, and 0.1.0 installed again. The record, in the shape of
# the checklist's results template, is the job's summary and an artefact,
# for pasting into the run's issue.
#
# On request only, with the Release's tag. The spec and its tooling come from
# the ref the run is dispatched on, since a tag cut before the spec existed
# does not carry it; what the app must report - the engine, Python and LOOM
# pins, and the version - is read from vendor/pins.json and package.json at
# the tag itself.
#
# What it cannot do is the rest of the gate (ADR-063, docs/releasing.md):
# the assistant's review of the images it keeps, and a person's sitting on the final candidate (docs/acceptance-sitting.md),
# which meets the Mac's first-open warning and walks by ear what no script
# heard. A runner downloads through the GitHub CLI, which sets no
# quarantine attribute and no mark of the web, so Gatekeeper and
# SmartScreen never ask; step 2 says so in the record. The stranger's
# timed run comes after the release.
#
# Read-only: the token lists and downloads Release assets, and reads their
# attestations (step 1), and nothing else. A draft Release is invisible to
# it; publish the draft (as a prerelease for an -rc tag) before dispatching
# this. No secrets. The network is used for the feeds the checklist
# downloads.
name: acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The Release to accept, by its tag (for example v0.1.0-rc.3)'
        required: true
        type: string

permissions:
  contents: read
  # gh attestation verify asks the attestations API for the installer's.
  attestations: read

jobs:
  acceptance:
    name: acceptance (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The spec's own limit is five hours; this leaves room for the install,
    # the uninstall, the update over 0.1.0 (each of its steps has a limit of
    # its own) and the upload. Six hours is a hosted runner's most.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # old_sha256 is step 22's 0.1.0 installer for the target, fixed for
          # ever: the line in v0.1.0's SHA256SUMS.txt, which GitHub's own
          # digest of the Release asset agrees with. 0.1.0 predates
          # attestations (ADR-057), so it has none to verify.
          - {
              os: macos-15,
              target: darwin-arm64,
              platform: macos,
              suffix: mac-arm64.dmg,
              old_sha256: 199fcf736985bca829c395a6e1b734be1dc1ffddf27cc11501ead9095fdbaab9,
            }
          - {
              os: windows-latest,
              target: win-x64,
              platform: windows,
              suffix: windows-x64-setup.exe,
              old_sha256: 52514a57f5dbeae192d6d4fd8366c293355351c1a40f68e52c24f0cbdd71edd0,
            }
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      SUFFIX: ${{ matrix.suffix }}
      PLATFORM: ${{ matrix.platform }}
      # Step 22's earlier version: the first release, from its own Release.
      UPGRADE_FROM: v0.1.0
      OLD_SHA256: ${{ matrix.old_sha256 }}
      # The job's limit, as timeout-minutes says it, and what step 22's steps
      # may take together: the most of each system's limits, and a margin.
      # tests/unit/acceptance-upgrade.test.ts holds both to the steps.
      JOB_MINUTES: 360
      UPGRADE_MINUTES: 195
    steps:
      - name: Refuse a tag that names no Release
        run: |
          # When the job began, near enough, for step 22's check of the time left.
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is neither v<X.Y.Z> nor v<X.Y.Z>-rc.<N>"
            exit 1
          fi

      # The whole history and every tag: a check of something newer than some
      # releases asks git whether this tag contains the commit that brought it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pins and the version the Release was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: at-tag
          persist-credentials: false
          sparse-checkout: |
            vendor/pins.json
            package.json
            electron-builder.yml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Where the run keeps its files
        run: |
          out="$RUNNER_TEMP/acceptance"
          mkdir -p "$out" "$RUNNER_TEMP/download"
          {
            echo "OUT=$out"
            echo "PRIOR=$out/prior.json"
            echo "DOWNLOAD=$RUNNER_TEMP/download"
            echo "ASSET=Legible-Cities-${TAG#v}-$SUFFIX"
            echo "UPGRADE=$RUNNER_TEMP/upgrade"
            echo "OLD_ASSET=Legible-Cities-${UPGRADE_FROM#v}-$SUFFIX"
          } >> "$GITHUB_ENV"

      # ATTESTED_SINCE is the commit that brought the attest job (pull request
      # 449, ADR-057). A tag that does not contain it, v0.1.0 among them, has
      # no attestation to verify, and a failed verify cannot say whether one
      # never existed or was refused, so git is asked which it is.
      - name: Step 1, download the installer and check it
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED_SINCE: 8d37d20ea4a97190104bbbadaf88b70eb83d570f
        run: |
          set -euo pipefail
          cli=tests/acceptance/record-cli.mjs
          node "$cli" prior "$PRIOR" field 'Installer file name' "$ASSET"
          node "$cli" prior "$PRIOR" field 'Clean machine?' "yes: a fresh GitHub runner (${ImageOS:-image unknown} ${ImageVersion:-})"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$DOWNLOAD" \
              --pattern "$ASSET" --pattern SHA256SUMS.txt; then
            node "$cli" prior "$PRIOR" step 1 fail "The Release for $TAG, $ASSET or SHA256SUMS.txt could not be downloaded; a draft is not visible to this read-only run."
            echo "::error::could not download $ASSET and SHA256SUMS.txt from the Release for $TAG (a draft is not visible to this run: publish it first)"
            exit 1
          fi
          actual=$(node "$cli" sha256 "$DOWNLOAD/$ASSET")
          node "$cli" prior "$PRIOR" field 'Its SHA-256' "$actual"
          if expected=$(node "$cli" sums "$DOWNLOAD/SHA256SUMS.txt" "$ASSET") && [ "$expected" = "$actual" ]; then
            node "$cli" prior "$PRIOR" field 'Matches SHA256SUMS.txt?' yes
          else
            node "$cli" prior "$PRIOR" field 'Matches SHA256SUMS.txt?' no
            node "$cli" prior "$PRIOR" step 1 fail "$ASSET has SHA-256 $actual; SHA256SUMS.txt says ${expected:-nothing}."
            echo "::error::$ASSET does not match SHA256SUMS.txt"
            exit 1
          fi
          checked="$ASSET, SHA-256 $actual, matches its line in SHA256SUMS.txt. Downloaded with the GitHub CLI, not a browser."

          # The same check a person makes with install.md's gh attestation
          # verify, asking for this repository, the build workflow, and the
          # tag under test, by name and by the commit it points at (issue 557,
          # ADR-057). Both files: the installer, and SHA256SUMS.txt that names
          # it. The commit is read into a variable first, belt and braces: the
          # case below already sends a tag git cannot find to its last branch,
          # and this makes sure one that still will not resolve stops the step
          # and never reaches gh as an empty --source-digest.
          contains=0
          git merge-base --is-ancestor "$ATTESTED_SINCE" "refs/tags/$TAG" || contains=$?
          case "$contains" in
            0)
              digest=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")
              for subject in "$DOWNLOAD/$ASSET" "$DOWNLOAD/SHA256SUMS.txt"; do
                if ! gh attestation verify "$subject" \
                    --repo "$GITHUB_REPOSITORY" \
                    --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
                    --source-ref "refs/tags/$TAG" \
                    --source-digest "$digest" \
                    --deny-self-hosted-runners; then
                  node "$cli" prior "$PRIOR" field 'Attestation verified?' no
                  node "$cli" prior "$PRIOR" step 1 fail "$checked But gh attestation verify refused $(basename "$subject") for refs/tags/$TAG."
                  echo "::error::$(basename "$subject") has no attestation from this repository's build workflow for $TAG"
                  exit 1
                fi
              done
              node "$cli" prior "$PRIOR" field 'Attestation verified?' yes
              node "$cli" prior "$PRIOR" step 1 pass "$checked Attestation verified for $ASSET and SHA256SUMS.txt: built by this repository's build workflow from refs/tags/$TAG, on a GitHub-hosted runner."
              ;;
            1)
              node "$cli" prior "$PRIOR" field 'Attestation verified?' 'not attested (before 1.0)'
              node "$cli" prior "$PRIOR" step 1 'pass, part not automated' "$checked Not automated: $TAG was tagged before the commit that brought attestations (${ATTESTED_SINCE:0:7}, ADR-057), so it has none to verify."
              ;;
            *)
              node "$cli" prior "$PRIOR" field 'Attestation verified?' no
              node "$cli" prior "$PRIOR" step 1 fail "$checked Git could not tell whether $TAG contains ${ATTESTED_SINCE:0:7}, so whether it should have an attestation is unknown."
              echo "::error::git could not tell whether $TAG contains the commit that brought attestations"
              exit 1
              ;;
          esac

      - name: Step 2, install on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cli=tests/acceptance/record-cli.mjs
          mount="$RUNNER_TEMP/dmg"
          apps="$RUNNER_TEMP/apps"
          mkdir -p "$mount" "$apps"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$DOWNLOAD/$ASSET"
          app="$mount/Legible Cities.app"
          if [ ! -d "$app" ]; then
            ls -la "$mount"
            hdiutil detach "$mount"
            node "$cli" prior "$PRIOR" step 2 fail "The disk image holds no Legible Cities.app."
            echo "::error::the disk image holds no Legible Cities.app"
            exit 1
          fi
          ditto "$app" "$apps/Legible Cities.app"
          hdiutil detach "$mount"
          if codesign --verify --deep --strict "$apps/Legible Cities.app" > /dev/null 2>&1; then
            signature='its ad-hoc signature verifies'
          else
            signature='its signature does not verify'
          fi
          if xattr -p com.apple.quarantine "$DOWNLOAD/$ASSET" > /dev/null 2>&1; then
            quarantine='a quarantine attribute'
          else
            quarantine='no quarantine attribute'
          fi
          node "$cli" prior "$PRIOR" step 2 'not automated' "Not a person's install: the dmg was mounted read-only and Legible Cities.app copied to a temporary folder, not dragged to Applications; the download has $quarantine, so Gatekeeper never asked and the way past its warning was not exercised; $signature. The app is opened by the spec in step 3."
          echo "LEGIBLE_ACCEPTANCE_APP=$apps/Legible Cities.app" >> "$GITHUB_ENV"
          echo "INSTALLED=$apps/Legible Cities.app" >> "$GITHUB_ENV"

      - name: Step 2, install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'tests/acceptance/record-cli.mjs'
          # The folder a per-user one-click NSIS installer uses is the
          # package's name, sanitised (electron-builder's
          # getWindowsInstallationDirName); a build that sets nsis options
          # could change that, so it is refused rather than guessed at. Four
          # are let through: include (build/installer.nsh, issue 128) and the
          # three icon options (issue 140), which draw the installer and say
          # nothing about where it installs. An include that moves the
          # install is caught by the exe check below. Any other line in the
          # nsis section, or one of these four written in any shape but a
          # plain `key: value`, is refused. oneClick is deliberately not on
          # the list: it changes the pages, the flow and this workflow's
          # assumptions together.
          $refused = @()
          $inNsis = $false
          foreach ($line in Get-Content -LiteralPath 'at-tag/electron-builder.yml') {
            if ($line -match '^["'']?nsis["'']?\s*:') {
              $inNsis = $true
              if ($line -notmatch '^["'']?nsis["'']?\s*:\s*(#.*)?$') { $refused += $line }
              continue
            }
            if (-not $inNsis -or $line -match '^\s*(#.*)?$') { continue }
            if ($line -notmatch '^\s') { $inNsis = $false; continue }
            if ($line -notmatch '^\s+(include|installerIcon|uninstallerIcon|installerHeaderIcon)\s*:\s*[^\s#''"{\[&*!|>]\S*\s*(#.*)?$') { $refused += $line.Trim() }
          }
          if ($refused.Count -gt 0) {
            node $cli prior $env:PRIOR step 2 fail "electron-builder.yml at the tag sets nsis options beyond include and the installer icons ($($refused -join ' / ')); this workflow assumes the per-user one-click defaults."
            throw "electron-builder.yml at the tag sets nsis options beyond include and the installer icons: $($refused -join ' / '). Check where it installs and update this workflow"
          }
          $name = node -p "require('./at-tag/package.json').name"
          $folder = Join-Path $env:LOCALAPPDATA "Programs\$name"
          $installer = Join-Path $env:DOWNLOAD $env:ASSET
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          $exe = Join-Path $folder 'Legible Cities.exe'
          if ($process.ExitCode -ne 0 -or -not (Test-Path $exe)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | Format-Table Name
            node $cli prior $env:PRIOR step 2 fail "The installer exited $($process.ExitCode) and there is no Legible Cities.exe in %LOCALAPPDATA%\Programs\$name."
            throw "the installer exited $($process.ExitCode); no $exe"
          }
          $startMenu = Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Legible Cities.lnk')
          $desktop = Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Legible Cities.lnk')
          node $cli prior $env:PRIOR step 2 'not automated' "Not a person's install: the installer ran silently (/S) and exited 0, into %LOCALAPPDATA%\Programs\$name; a file the GitHub CLI downloads carries no mark of the web, so SmartScreen never asked and the way past its warning was not exercised; a silent install does not open the app, so the spec opens it in step 3. Start menu shortcut: $startMenu; desktop shortcut: $desktop."
          "LEGIBLE_ACCEPTANCE_APP=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLED=$folder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Steps 3 to 20, the installed app
        id: spec
        env:
          CI: 'true'
          LEGIBLE_ACCEPTANCE_PINS: ${{ github.workspace }}/at-tag/vendor/pins.json
        run: |
          export LEGIBLE_ACCEPTANCE_OUT="$OUT"
          export LEGIBLE_ACCEPTANCE_PRIOR="$PRIOR"
          export LEGIBLE_ACCEPTANCE_TAG="$TAG"
          npm run test:acceptance

      - name: Step 21, uninstall on macOS
        if: ${{ !cancelled() && runner.os == 'macOS' && env.INSTALLED != '' }}
        run: |
          rm -rf "$INSTALLED"
          node tests/acceptance/record-cli.mjs leftovers "$OUT/made.json" "$OUT/acceptance-$PLATFORM.md" "$INSTALLED"

      - name: Step 21, uninstall on Windows
        if: ${{ !cancelled() && runner.os == 'Windows' && env.INSTALLED != '' }}
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:INSTALLED 'Uninstall Legible Cities.exe'
          if (Test-Path $uninstaller) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            Write-Output "the uninstaller exited $($process.ExitCode)"
            # An NSIS uninstaller copies itself out of the folder and goes on
            # from there, so its end is the folder going, within a deadline.
            $deadline = (Get-Date).AddMinutes(3)
            while ((Test-Path $env:INSTALLED) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          } else {
            Write-Output "no uninstaller at $uninstaller"
          }
          node tests/acceptance/record-cli.mjs leftovers "$env:OUT/made.json" "$env:OUT/acceptance-$env:PLATFORM.md" $env:INSTALLED
          exit $LASTEXITCODE

      # The record, the evidence and its key as steps 1 to 21 left them, kept
      # now: a job that runs out of time is cancelled, and no step after that
      # runs. Uploaded again, over these, once step 22 is written.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/acceptance/*.md
            ${{ runner.temp }}/acceptance/*.png
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/acceptance/evidence/
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-evidence-key-${{ matrix.target }}
          path: ${{ runner.temp }}/acceptance/evidence-key/
          if-no-files-found: warn
          retention-days: 30

      # Step 22 starts only with the time for all of it: cut off part-way by
      # the job's limit, it would leave nothing written. Otherwise its row says
      # it was not run, and why.
      - name: Step 22, the time left
        if: ${{ !cancelled() && env.INSTALLED != '' }}
        run: |
          set -euo pipefail
          left=$(( JOB_MINUTES - ( $(date +%s) - JOB_STARTED ) / 60 ))
          if [ "$left" -ge "$UPGRADE_MINUTES" ]; then
            echo "UPGRADE_RUN=yes" >> "$GITHUB_ENV"
            echo "$left minutes left; step 22 may take $UPGRADE_MINUTES"
          else
            echo "::warning::step 22 not run: $left minutes of the job's time left, and it may take $UPGRADE_MINUTES"
            record="$OUT/acceptance-$PLATFORM.md"
            if [ -f "$record" ]; then
              node tests/acceptance/record-cli.mjs step 22 "$record" --not-run \
                "too little of the job's time left ($left minutes, and the step may take $UPGRADE_MINUTES)"
            fi
          fi

      # Step 22, the update over 0.1.0 (docs/acceptance.md). Each version is
      # installed the way a person installs it - on a Mac copied into
      # Applications, the old bundle removed first as the Finder's Replace
      # does; on Windows the installer, run silently - and each phase runs on
      # the version's own default profile, with no --user-data-dir, so each
      # version's own path resolution is what links them. Step 21 has left
      # the runner without the app. upgrade.json, which the phases write and
      # read, holds absolute paths and is not uploaded.
      - name: Step 22, install 0.1.0 on macOS
        id: old_mac
        if: ${{ !cancelled() && runner.os == 'macOS' && env.UPGRADE_RUN == 'yes' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cli=tests/acceptance/record-cli.mjs
          mkdir -p "$UPGRADE/download" "$UPGRADE/dmg"
          gh release download "$UPGRADE_FROM" --repo "$GITHUB_REPOSITORY" --dir "$UPGRADE/download" \
            --pattern "$OLD_ASSET" --pattern SHA256SUMS.txt
          actual=$(node "$cli" sha256 "$UPGRADE/download/$OLD_ASSET")
          if [ "$actual" != "$OLD_SHA256" ]; then
            echo "::error::$OLD_ASSET has SHA-256 $actual, not the $OLD_SHA256 this workflow holds for it"
            exit 1
          fi
          expected=$(node "$cli" sums "$UPGRADE/download/SHA256SUMS.txt" "$OLD_ASSET")
          if [ "$actual" != "$expected" ]; then
            echo "::error::$OLD_ASSET does not match its Release's SHA256SUMS.txt"
            exit 1
          fi
          app="/Applications/Legible Cities.app"
          if [ -e "$app" ]; then
            echo "::error::$app is already there, so this is not the machine step 21 left"
            exit 1
          fi
          hdiutil attach -readonly -nobrowse -mountpoint "$UPGRADE/dmg" "$UPGRADE/download/$OLD_ASSET"
          ditto "$UPGRADE/dmg/Legible Cities.app" "$app"
          hdiutil detach "$UPGRADE/dmg"
          echo "UPGRADE_APP=$app" >> "$GITHUB_ENV"

      - name: Step 22, install 0.1.0 on Windows
        id: old_win
        if: ${{ !cancelled() && runner.os == 'Windows' && env.UPGRADE_RUN == 'yes' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'tests/acceptance/record-cli.mjs'
          $download = Join-Path $env:UPGRADE 'download'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download $env:UPGRADE_FROM --repo $env:GITHUB_REPOSITORY --dir $download --pattern $env:OLD_ASSET --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "could not download $env:OLD_ASSET" }
          $installer = Join-Path $download $env:OLD_ASSET
          # Each command's exit and the shape of what it printed are checked
          # before its output is compared: an empty or failed answer must
          # never be what two failures agree on.
          $actual = node $cli sha256 $installer
          if ($LASTEXITCODE -ne 0 -or $actual -notmatch '^[0-9a-f]{64}$') { throw "could not hash $env:OLD_ASSET" }
          if ($actual -ne $env:OLD_SHA256) { throw "$env:OLD_ASSET has SHA-256 $actual, not the $env:OLD_SHA256 this workflow holds for it" }
          $expected = node $cli sums (Join-Path $download 'SHA256SUMS.txt') $env:OLD_ASSET
          if ($LASTEXITCODE -ne 0 -or $expected -notmatch '^[0-9a-f]{64}$') { throw "SHA256SUMS.txt has no line for $env:OLD_ASSET" }
          if ($actual -ne $expected) { throw "$env:OLD_ASSET does not match its Release's SHA256SUMS.txt" }
          # The folder a per-user one-click installer uses is the package's
          # name at that tag; step 2 has refused an nsis section that would
          # move it for the release under test, and 0.1.0's is fixed history.
          # The exe is checked for, so a folder that moved is caught.
          $manifest = git show "refs/tags/$($env:UPGRADE_FROM):package.json" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "git could not read package.json at $env:UPGRADE_FROM" }
          $name = ($manifest | ConvertFrom-Json).name
          if ($name -notmatch '^[a-z0-9][a-z0-9._-]*$') { throw "package.json at $env:UPGRADE_FROM names no package: '$name'" }
          $folder = Join-Path $env:LOCALAPPDATA "Programs\$name"
          $exe = Join-Path $folder 'Legible Cities.exe'
          if (Test-Path $exe) { throw "$exe is already there, so this is not the machine step 21 left" }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $exe)) {
            throw "the 0.1.0 installer exited $($process.ExitCode); no $exe"
          }
          "UPGRADE_APP=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPGRADE_FOLDER=$folder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Step 22, the seed, on 0.1.0
        id: seed
        if: ${{ !cancelled() && (steps.old_mac.outcome == 'success' || steps.old_win.outcome == 'success') }}
        timeout-minutes: 60
        env:
          CI: 'true'
          LEGIBLE_UPGRADE_PHASE: seed
        run: |
          export LEGIBLE_UPGRADE_APP="$UPGRADE_APP"
          export LEGIBLE_ACCEPTANCE_OUT="$OUT"
          npm run test:acceptance -- tests/acceptance/upgrade.spec.ts

      # Over the 0.1.0 the seed quit, once nothing of it is still running.
      - name: Step 22, install the release over 0.1.0 on macOS
        id: over_mac
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.seed.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for _ in $(seq 60); do pgrep -f "$UPGRADE_APP/" > /dev/null || break; sleep 2; done
          if pgrep -fl "$UPGRADE_APP/"; then echo "::error::0.1.0 is still running"; exit 1; fi
          rm -rf "$UPGRADE_APP"
          hdiutil attach -readonly -nobrowse -mountpoint "$UPGRADE/dmg" "$DOWNLOAD/$ASSET"
          ditto "$UPGRADE/dmg/Legible Cities.app" "$UPGRADE_APP"
          hdiutil detach "$UPGRADE/dmg"

      - name: Step 22, install the release over 0.1.0 on Windows
        id: over_win
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.seed.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = $env:UPGRADE_FOLDER
          $running = { @(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($folder, [System.StringComparison]::OrdinalIgnoreCase) }) }
          $deadline = (Get-Date).AddMinutes(2)
          while ((& $running).Count -gt 0 -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if ((& $running).Count -gt 0) { throw "0.1.0 is still running: $((& $running).Name -join ', ')" }
          $process = Start-Process -FilePath (Join-Path $env:DOWNLOAD $env:ASSET) -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $env:UPGRADE_APP)) {
            throw "the installer exited $($process.ExitCode); no $env:UPGRADE_APP"
          }

      - name: Step 22, after the update
        id: after
        if: ${{ !cancelled() && (steps.over_mac.outcome == 'success' || steps.over_win.outcome == 'success') }}
        timeout-minutes: 60
        env:
          CI: 'true'
          LEGIBLE_UPGRADE_PHASE: after
        run: |
          export LEGIBLE_UPGRADE_APP="$UPGRADE_APP"
          export LEGIBLE_ACCEPTANCE_OUT="$OUT"
          export LEGIBLE_UPGRADE_VERSION="$(node -p "require('./at-tag/package.json').version")"
          npm run test:acceptance -- tests/acceptance/upgrade.spec.ts

      # Going back as install.md's "Updating from an earlier release" says:
      # the new version removed (removing the app leaves its data), then
      # 0.1.0 installed.
      - name: Step 22, install 0.1.0 again on macOS
        id: again_mac
        if: ${{ !cancelled() && runner.os == 'macOS' && (steps.after.outcome == 'success' || steps.after.outcome == 'failure') }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for _ in $(seq 60); do pgrep -f "$UPGRADE_APP/" > /dev/null || break; sleep 2; done
          if pgrep -fl "$UPGRADE_APP/"; then echo "::error::the release is still running"; exit 1; fi
          rm -rf "$UPGRADE_APP"
          hdiutil attach -readonly -nobrowse -mountpoint "$UPGRADE/dmg" "$UPGRADE/download/$OLD_ASSET"
          ditto "$UPGRADE/dmg/Legible Cities.app" "$UPGRADE_APP"
          hdiutil detach "$UPGRADE/dmg"

      - name: Step 22, install 0.1.0 again on Windows
        id: again_win
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.after.outcome == 'success' || steps.after.outcome == 'failure') }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = $env:UPGRADE_FOLDER
          $running = { @(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($folder, [System.StringComparison]::OrdinalIgnoreCase) }) }
          $deadline = (Get-Date).AddMinutes(2)
          while ((& $running).Count -gt 0 -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if ((& $running).Count -gt 0) { throw "the release is still running: $((& $running).Name -join ', ')" }
          # An NSIS uninstaller copies itself out of the folder and goes on
          # from there, so its end is the folder going, within a deadline.
          $uninstaller = Join-Path $folder 'Uninstall Legible Cities.exe'
          if (-not (Test-Path $uninstaller)) { throw "no uninstaller at $uninstaller" }
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
          $deadline = (Get-Date).AddMinutes(3)
          while ((Test-Path $folder) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          if (Test-Path $folder) { throw "the uninstaller left $folder" }
          $installer = Join-Path (Join-Path $env:UPGRADE 'download') $env:OLD_ASSET
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $env:UPGRADE_APP)) {
            throw "the 0.1.0 installer exited $($process.ExitCode); no $env:UPGRADE_APP"
          }

      - name: Step 22, back on 0.1.0
        id: back
        if: ${{ !cancelled() && (steps.again_mac.outcome == 'success' || steps.again_win.outcome == 'success') }}
        timeout-minutes: 20
        env:
          CI: 'true'
          LEGIBLE_UPGRADE_PHASE: back
        run: |
          export LEGIBLE_UPGRADE_APP="$UPGRADE_APP"
          export LEGIBLE_ACCEPTANCE_OUT="$OUT"
          npm run test:acceptance -- tests/acceptance/upgrade.spec.ts

      # Every step's outcome, so a step that failed or never ran is named in
      # the row; a phase's own findings are in upgrade.json.
      - name: Step 22, the record
        if: ${{ !cancelled() && env.UPGRADE_RUN == 'yes' }}
        timeout-minutes: 5
        env:
          OLD: ${{ runner.os == 'macOS' && steps.old_mac.outcome || steps.old_win.outcome }}
          SEED: ${{ steps.seed.outcome }}
          OVER: ${{ runner.os == 'macOS' && steps.over_mac.outcome || steps.over_win.outcome }}
          AFTER: ${{ steps.after.outcome }}
          AGAIN: ${{ runner.os == 'macOS' && steps.again_mac.outcome || steps.again_win.outcome }}
          BACK: ${{ steps.back.outcome }}
        run: |
          node tests/acceptance/record-cli.mjs step 22 "$OUT/acceptance-$PLATFORM.md" "$OUT/upgrade.json" \
            "install 0.1.0=$OLD" "the seed on 0.1.0=$SEED" "install the release over it=$OVER" \
            "after the update=$AFTER" "install 0.1.0 again=$AGAIN" "back on 0.1.0=$BACK"

      - name: The record, as the job's summary
        if: ${{ !cancelled() }}
        run: |
          record="$OUT/acceptance-$PLATFORM.md"
          if [ -f "$record" ]; then
            {
              echo "Issue title: \`A6-04 run: $([ "$PLATFORM" = macos ] && echo macOS || echo Windows) ${TAG#v}, $(date -u +%F)\`"
              echo
              cat "$record"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No record was written: the spec did not start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-${{ matrix.target }}
          # Over the copy kept after step 21.
          overwrite: true
          # Not made.json: its paths are absolute and unredacted, for step 21's
          # check on the runner only. The screenshots are not redacted either,
          # but a runner's folders are outside any person's home.
          path: |
            ${{ runner.temp }}/acceptance/*.md
            ${{ runner.temp }}/acceptance/*.png
          if-no-files-found: warn
          retention-days: 30

      # The pictures a reviewer reads, and the manifest that names them
      # (docs/acceptance.md, "The visual evidence"): one artefact a system, so
      # a run keeps both. A run that fails still has what it took.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-evidence-${{ matrix.target }}
          # Over the copy kept after step 21.
          overwrite: true
          path: ${{ runner.temp }}/acceptance/evidence/
          if-no-files-found: warn
          retention-days: 30

      # The key to the control pairs, apart from the evidence: the reviewer
      # opens it only after every verdict is written.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-evidence-key-${{ matrix.target }}
          # Over the copy kept after step 21.
          overwrite: true
          path: ${{ runner.temp }}/acceptance/evidence-key/
          if-no-files-found: warn
          retention-days: 30

  # The screen-reader walkthrough's VoiceOver column, heard by a script
  # (issue 691, tests/reader/voiceover.spec.ts): VoiceOver driven by
  # Guidepup over the same Release's Mac app, one step per walkthrough row.
  # What it writes is what was spoken, never a pass: the transcript, and the
  # record with a clause appended to each row's VoiceOver cell, for a person
  # to read and commit. Hosted macOS only: on a person's Mac the setup asks
  # for a checkbox ticked by hand and takes over their VoiceOver. The method
  # is the spike's (docs/adr/spikes/gate-tools-on-hosted-macos.md).
  reader:
    name: reader (VoiceOver, darwin-arm64)
    runs-on: macos-15
    # Two real layouts, an export and some seventy rows; the spec's own limit
    # is two hours, and the two setup steps may take three tries each. The
    # steps' own limits add up to 243 minutes, and the job's covers them.
    timeout-minutes: 250
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The setup below rewrites VoiceOver's and the system's accessibility
      # settings and takes over the keyboard: never on a person's machine,
      # and never on a self-hosted runner, which is one.
      - name: Refuse anything but a GitHub-hosted runner
        timeout-minutes: 1
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::the reader job sets up VoiceOver for automation and runs only on a GitHub-hosted runner (this is ${RUNNER_ENVIRONMENT:-unknown})"
            exit 1
          fi

      - name: Refuse a tag that names no Release
        timeout-minutes: 1
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is neither v<X.Y.Z> nor v<X.Y.Z>-rc.<N>"
            exit 1
          fi

      # The whole history and every tag, for the attestation check below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node 24, as the spike ran Guidepup's setup (its record names Node 24
      # for the setup step; Node 22 was not tried there).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 10
        with:
          node-version: 24
          cache: npm

      - name: Install
        timeout-minutes: 10
        run: npm ci

      # Checked as step 1 of the acceptance job checks it: against
      # SHA256SUMS.txt, and, for a tag that contains the commit that brought
      # attestations (ATTESTED_SINCE, ADR-057), by gh attestation verify for
      # this repository's build workflow and this tag.
      - name: The Mac app
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED_SINCE: 8d37d20ea4a97190104bbbadaf88b70eb83d570f
        run: |
          set -euo pipefail
          cli=tests/acceptance/record-cli.mjs
          asset="Legible-Cities-${TAG#v}-mac-arm64.dmg"
          download="$RUNNER_TEMP/download"
          mount="$RUNNER_TEMP/dmg"
          apps="$RUNNER_TEMP/apps"
          mkdir -p "$download" "$mount" "$apps"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$download" \
            --pattern "$asset" --pattern SHA256SUMS.txt
          actual=$(node "$cli" sha256 "$download/$asset")
          expected=$(node "$cli" sums "$download/SHA256SUMS.txt" "$asset")
          if [ "$expected" != "$actual" ]; then
            echo "::error::$asset has SHA-256 $actual; SHA256SUMS.txt says $expected"
            exit 1
          fi
          attested=0
          git merge-base --is-ancestor "$ATTESTED_SINCE" "refs/tags/$TAG" || attested=$?
          case "$attested" in
            0)
              commit=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")
              for file in "$download/$asset" "$download/SHA256SUMS.txt"; do
                if ! gh attestation verify "$file" \
                    --repo "$GITHUB_REPOSITORY" \
                    --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
                    --source-ref "refs/tags/${TAG}" \
                    --source-digest "$commit" \
                    --deny-self-hosted-runners; then
                  echo "::error::$(basename "$file") has no attestation from this repository's build workflow for $TAG"
                  exit 1
                fi
              done
              ;;
            1)
              echo "$TAG was tagged before attestations (${ATTESTED_SINCE:0:7}); it has none to verify."
              ;;
            *)
              echo "::error::git could not tell whether $TAG contains the commit that brought attestations"
              exit 1
              ;;
          esac
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$download/$asset"
          ditto "$mount/Legible Cities.app" "$apps/Legible Cities.app"
          hdiutil detach "$mount"
          echo "LEGIBLE_READER_APP=$apps/Legible Cities.app" >> "$GITHUB_ENV"

      # Up to three tries, a pause between: its AppleScript for the
      # system's settings has failed once on a runner where it passed
      # before (error -2700, Do Not Disturb in Control Center). Each try is
      # ended at 600 s by an alarm the command inherits; three tries and the
      # pauses are inside the step's limit.
      - name: Set up VoiceOver for automation
        timeout-minutes: 32
        run: |
          for try in 1 2 3; do
            if perl -e 'alarm 600; exec @ARGV' npx -y @guidepup/setup@0.29.3 setup --ci; then exit 0; fi
            echo "::warning::guidepup's VoiceOver setup failed on try $try of 3"
            if [ "$try" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::guidepup's setup (@guidepup/setup setup --ci) failed three times: the runner could not be prepared for VoiceOver, so the walkthrough was not run; this is not a result of the walk"
          exit 1

      # Without these VoiceOver will not start under Guidepup ("Failed to
      # mount Guidepup preferences"). Run where @guidepup/guidepup is
      # installed, since it reads that package's manifest. Tried as above.
      - name: Guidepup's VoiceOver assets
        timeout-minutes: 32
        run: |
          for try in 1 2 3; do
            if perl -e 'alarm 600; exec @ARGV' npx -y @guidepup/setup@0.29.3 install voiceover; then exit 0; fi
            echo "::warning::guidepup's VoiceOver assets failed to install on try $try of 3"
            if [ "$try" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::guidepup's setup (@guidepup/setup install voiceover) failed three times: VoiceOver's assets for Guidepup are missing, so the walkthrough was not run; this is not a result of the walk"
          exit 1

      # Fails only when a row's script stopped: a row not heard is a
      # finding (ADR-063), listed at the top of the summary, whose clause
      # carries #<issue> until a person files one.
      - name: The walkthrough, heard
        timeout-minutes: 130
        env:
          CI: 'true'
        run: |
          export LEGIBLE_READER_OUT="$RUNNER_TEMP/reader"
          npm run test:reader

      - name: The transcript, as the job's summary
        # Even after a timeout, so what was heard is kept.
        if: always()
        timeout-minutes: 2
        run: |
          transcript="$RUNNER_TEMP/reader/transcript.md"
          notheard="$RUNNER_TEMP/reader/not-heard.md"
          {
            # First, the findings: a row not heard does not fail the job
            # (ADR-063); a row whose script stopped does.
            if [ -f "$notheard" ]; then
              cat "$notheard"
              echo
            fi
            echo "Heard is not a pass: no one listened. Before any clause in this run's accessibility.md or clauses.md is committed, replace each \`#<issue>\` with the number of an issue filed for what was not heard; the record's test refuses the cell until then."
            echo
            if [ -f "$transcript" ]; then
              cat "$transcript"
            else
              echo "No transcript was written: the spec did not start."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Even after a timeout, so what was heard is kept.
        if: always()
        timeout-minutes: 5
        with:
          name: reader-darwin-arm64
          path: |
            ${{ runner.temp }}/reader/*.md
            ${{ runner.temp }}/reader/*.json
          if-no-files-found: warn
          retention-days: 30
