# The constitution's third principle, tested where it has to hold: the same
# project, exported twice by the app, captures the same frames within a
# channel tolerance of 8 in RGB, from the same stored layout, with no layout
# requested, and delivers two well-formed GIFs (A5-04,
# tests/e2e/determinism.spec.ts). The GIFs' pixels are reported, not judged:
# the engine's GIF palette does not preserve the tolerance (engine issue 33). The committed BART fixture
# is exported as a draft instagram-reel-gif against the real engine at its
# pin and the vendored ffmpeg, on the three platforms the app ships for.
#
# Once per pull request, and five times on the weekly schedule, because one
# agreeing pair is not evidence: spike A0-05 was fooled twice by samples that
# small. Not a required check until it has earned it; the maintainer decides.
#
# A dispatch can repeat it (issue 100: under load, one baseline run of
# thirteen captured one frame from the wrong paint). `repeats`, 1 to 60, runs
# the gate that many times; `load` keeps every core but one busy with `node`
# loops while the suite runs; `os` keeps to one platform. With no inputs, and
# on a pull request or the schedule, nothing is different. A repeat is a
# matrix leg: a runner of its own and a fresh launch of the app, so a repeat's
# leftovers cannot reach the next, a failing repeat stops none of the others,
# and its report is an artifact of its own, determinism-report-<os>-run<N>.
# It is not `--repeat-each` on the spec, though the test is self-contained
# enough to take it: sixty runs of minutes each, one after another, are most
# of a job's six hours, they would share one runner's leftovers, and the
# evidence of one failing run would be an artifact holding every run's GIFs.
# The cost of a leg per repeat is its setup: after the pins or the vendoring
# scripts change, dispatch once with repeats 1, so the caches are warm and
# sixty legs do not each build ffmpeg.
#
# A pull request runs it only when it touches what the export or this test is
# made of: the app, the test and its fixture, the pins and the vendoring
# scripts, the packages, and the build and test configuration. A change to
# documentation alone costs three runners nothing. The weekly schedule runs it
# whatever changed. Should it become a required check, remove the filter, or a
# pull request that skips it waits for it forever.
name: determinism

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/determinism.spec.ts'
      - 'tests/e2e/global-*.ts'
      - 'tests/unit/determinism-real.test.ts'
      - 'tests/support/**'
      - 'tests/fixtures/determinism/**'
      - 'vendor/pins.json'
      - 'scripts/vendor-*.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'playwright.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/determinism.yml'
  schedule:
    # Mondays, 05:17 UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      repeats:
        description: 'How many times to run the gate on each platform (1 to 60)'
        type: number
        default: 1
      load:
        description: 'Keep every core but one busy while the suite runs'
        type: boolean
        default: false
      os:
        description: 'The platform to run on, or all three'
        type: choice
        options:
          - all
          - ubuntu-22.04
          - macos-15
          - windows-latest
        default: all

permissions:
  contents: read

# A newer push to the same branch makes the older run's answer moot. A
# dispatch is the exception: its group is its own run, so two dispatches
# on one branch (three platforms, say) never cancel one another.
concurrency:
  group: determinism-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub's matrix has no range, so the legs come from a job: one per
  # platform and repeat, the three platforms once on a pull request, five
  # times on the schedule, and what the dispatch asked for. The inputs are
  # read from the environment, never interpolated into the script.
  plan:
    name: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Plan the legs
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REPEATS: ${{ inputs.repeats }}
          ONLY_OS: ${{ inputs.os }}
        run: |
          repeats=1
          only=all
          if [ "$EVENT" = schedule ]; then
            repeats=5
          elif [ "$EVENT" = workflow_dispatch ]; then
            repeats=${REPEATS:-1}
            only=${ONLY_OS:-all}
          fi
          case "$repeats" in
            '' | *[!0-9]*)
              echo "::error::repeats must be a whole number from 1 to 60, not '$repeats'"
              exit 1
              ;;
          esac
          # Leading zeros are no part of the number, and a long one would wrap
          # the arithmetic: past two digits it is refused before it is compared.
          given=$repeats
          repeats=${repeats#"${repeats%%[!0]*}"}
          repeats=${repeats:-0}
          if [ "${#repeats}" -gt 2 ] || [ "$repeats" -lt 1 ] || [ "$repeats" -gt 60 ]; then
            echo "::error::repeats must be from 1 to 60, not $given"
            exit 1
          fi
          matrix=$(jq -cn --argjson repeats "$repeats" --arg only "$only" '
            [
              { os: "ubuntu-22.04", target: "linux-x64" },
              { os: "macos-15", target: "darwin-arm64" },
              { os: "windows-latest", target: "win-x64" }
            ]
            | map(select($only == "all" or .os == $only))
            | { include: [ .[] as $leg | range(1; $repeats + 1) | $leg + { run: . } ] }
          ')
          legs=$(jq '.include | length' <<<"$matrix")
          if [ "$legs" -eq 0 ]; then
            echo "::error::no platform is called '$only'"
            exit 1
          fi
          echo "$legs legs: $repeats repeat(s) on $only"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  determinism:
    name: determinism (${{ matrix.os }}, run ${{ matrix.run }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Read the engine's pin
        id: engine
        run: |
          host_py=python3
          "$host_py" -c 'import sys' >/dev/null 2>&1 || host_py=python
          "$host_py" - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.stdout.reconfigure(newline='\n')  # no \r in an output value on Windows
          engine = json.load(open('vendor/pins.json'))['engine']
          owner_repo = engine['repo'].removeprefix('https://github.com/').removesuffix('.git')
          if owner_repo.count('/') != 1:
              raise SystemExit(f"engine.repo is not a GitHub URL: {engine['repo']}")
          print(f"repo={owner_repo}")
          print(f"tag={engine['tag']}")
          print(f"version={engine['version']}")
          PY

      - name: Check out the engine at its pin
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.engine.outputs.repo }}
          ref: ${{ steps.engine.outputs.tag }}
          path: engine
          persist-credentials: false

      - name: Refuse an engine that is not the pinned version
        env:
          PINNED_VERSION: ${{ steps.engine.outputs.version }}
          PINNED_TAG: ${{ steps.engine.outputs.tag }}
        run: |
          found=$(grep -oE '__version__ *= *"[^"]+"' engine/src/schematic/__init__.py | head -1 | cut -d'"' -f2)
          if [ "$found" != "$PINNED_VERSION" ]; then
            echo "::error::the pin says $PINNED_VERSION, the tag holds $found"
            exit 1
          fi
          echo "engine $found at $PINNED_TAG"

      # macOS and Windows run the runtime the app ships: python-build-standalone
      # at its pin with the engine installed, as the vendor workflow proves it.
      # Cached by the pins and the scripts, which together say exactly what
      # was vendored: a changed pin or script is a new key and a fresh, proven
      # runtime. The runtime's dependencies are not locked, so on a cache hit
      # they stay as first resolved until the pins change, while the Linux job
      # resolves them afresh on every run.
      - name: Restore the vendored runtime (macOS, Windows)
        if: runner.os != 'Linux'
        id: python-cache
        uses: actions/cache@v6
        with:
          path: vendor/python/${{ matrix.target }}
          key: determinism-python-${{ matrix.target }}-${{ hashFiles('vendor/pins.json', 'scripts/vendor-*.sh') }}

      - name: Vendor the runtime with the engine (macOS, Windows)
        if: runner.os != 'Linux' && steps.python-cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/vendor-python.sh "$TARGET" engine

      - name: Point the test at the runtime (macOS, Windows)
        if: runner.os != 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            win-*) py="$GITHUB_WORKSPACE/vendor/python/$TARGET/python/python.exe" ;;
            *)     py="$GITHUB_WORKSPACE/vendor/python/$TARGET/python/bin/python3" ;;
          esac
          echo "LEGIBLE_ENGINE_PYTHON=$py" >> "$GITHUB_ENV"

      # There is no Linux runtime pin (the app does not ship for Linux), so the
      # Linux job installs the engine at the same tag into a Python 3.12, the
      # version the runtime pin carries.
      - name: Set up Python 3.12 (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the engine at its pin (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/engine-venv"
          py="$RUNNER_TEMP/engine-venv/bin/python"
          "$py" -m pip install --quiet --upgrade pip
          "$py" -m pip install --quiet ./engine
          "$py" -m pip list --format=freeze | sed 's/^/  /'
          echo "LEGIBLE_ENGINE_PYTHON=$py" >> "$GITHUB_ENV"

      # The check vendor-python.sh makes of the runtimes it builds, made of
      # this install too: the engine installed is the one whose protocol the
      # app was generated from.
      - name: Refuse an engine whose schema is not the pinned one (Linux)
        if: runner.os == 'Linux'
        run: |
          want=$(python3 -c "import json;print(json.load(open('vendor/pins.json'))['engine']['schema_sha256'])")
          got=$("$LEGIBLE_ENGINE_PYTHON" -m schematic.serve --schema | tr -d '\r' | sha256sum | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::the installed engine's schema is not the pinned one"
            echo "  engine.schema_sha256 $want"
            echo "  installed engine     $got"
            exit 1
          fi
          echo "schema ok: $got"

      - name: Restore the vendored ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg/${{ matrix.target }}
          key: determinism-ffmpeg-${{ matrix.target }}-${{ hashFiles('vendor/pins.json', 'scripts/vendor-*.sh') }}

      # ffmpeg is built from the pinned sources by the script the vendor
      # workflow runs (ADR-040), so a cache miss needs the same toolchain:
      # nasm, pkg-config and zlib's headers on Linux, pkg-config on the Mac,
      # and MSYS2 UCRT64 on Windows, where the build runs in MSYS2's shell
      # and the proof in Git Bash, as in vendor.yml.
      - name: Build tools for ffmpeg (Linux)
        if: runner.os == 'Linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nasm pkgconf zlib1g-dev

      - name: Build tools for ffmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: command -v pkg-config >/dev/null || brew install pkgconf

      - name: Vendor ffmpeg (Linux, macOS)
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/vendor-ffmpeg.sh "$TARGET"

      - name: Build tools for ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            git
            curl
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python

      - name: Build ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/vendor-ffmpeg.sh --build-only "$TARGET" vendor/ffmpeg/.built-win-x64

      - name: Vendor ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/vendor-ffmpeg.sh --from vendor/ffmpeg/.built-win-x64 "$TARGET"

      - name: Point the test at ffmpeg
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            win-*) exe=.exe ;;
            *)     exe= ;;
          esac
          echo "SCHEMATIC_FFMPEG=$GITHUB_WORKSPACE/vendor/ffmpeg/$TARGET/ffmpeg$exe" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Fetch the Electron binary
        run: npx install-electron --no

      - name: Build
        run: npm run build

      # The fixture's folder must be the id this engine addresses for BART,
      # or the exports below compare a layout no project could have. Proven
      # on every run, against the engine this run installed.
      - name: Prove the fixture's layout id against the pinned engine
        run: npx vitest run tests/unit/determinism-real.test.ts
        env:
          LEGIBLE_DETERMINISM_TEST: '1'

      # One busy `node` per core but one, with the counts printed. They start
      # detached with no stdio, so they outlive this step and the runner does
      # not wait on them, and node's own pids, which mean the same in every
      # step's shell on every platform, are written where the stop step reads
      # them. Started after the build and the unit proof, so the setup is not
      # what is slowed. A leg that asked for load and did not get it is not the
      # experiment that was asked for, so a loop that will not start or is gone
      # within a second fails this step, and the suite is skipped.
      - name: Start the load
        if: inputs.load == true
        run: |
          node -e '
            const { spawn } = require("node:child_process");
            const { appendFileSync, writeFileSync } = require("node:fs");
            const { availableParallelism } = require("node:os");
            const { join } = require("node:path");
            const file = join(process.env.RUNNER_TEMP, "determinism-load.pids");
            const cores = availableParallelism();
            const count = Math.max(0, cores - 1);
            writeFileSync(file, "");
            const pids = [];
            for (let i = 0; i < count; i++) {
              const child = spawn(process.execPath, ["-e", "for(;;){}"], {
                detached: true,
                stdio: "ignore",
                windowsHide: true,
              });
              child.on("error", (error) => {
                console.log(`::error::a busy loop did not start: ${error.message}`);
                process.exitCode = 1;
              });
              child.unref();
              if (child.pid !== undefined) {
                pids.push(child.pid);
                appendFileSync(file, `${child.pid}\n`);
              }
            }
            setTimeout(() => {
              const alive = pids.filter((pid) => {
                try { process.kill(pid, 0); return true; } catch { return false; }
              });
              console.log(`load: ${cores} cores, ${count} busy loops wanted, ${pids.length} started, ${alive.length} running`);
              if (alive.length < count) {
                console.log("::error::fewer busy loops are running than were wanted");
                process.exitCode = 1;
              }
            }, 1000);
          '

      - name: Export twice and compare (Linux, under a display server)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test tests/e2e/determinism.spec.ts
        env:
          CI: 'true'
          LEGIBLE_DETERMINISM_TEST: '1'

      - name: Export twice and compare
        if: runner.os != 'Linux'
        run: npx playwright test tests/e2e/determinism.spec.ts
        env:
          CI: 'true'
          LEGIBLE_DETERMINISM_TEST: '1'

      # Stopped when the suite is over, however it ended, and counted: a loop
      # that had already gone would mean the pass or the failure above was
      # not measured under the load that was asked for.
      - name: Stop the load
        if: always() && inputs.load == true
        run: |
          node -e '
            const { existsSync, readFileSync } = require("node:fs");
            const { join } = require("node:path");
            const file = join(process.env.RUNNER_TEMP, "determinism-load.pids");
            if (!existsSync(file)) {
              console.log("load: none was started");
              process.exit(0);
            }
            const pids = readFileSync(file, "utf8").split("\n").filter(Boolean).map(Number);
            let running = 0;
            let stopped = 0;
            for (const pid of pids) {
              try { process.kill(pid, 0); running += 1; } catch { continue; }
              try { process.kill(pid); stopped += 1; } catch (error) {
                console.log(`load: could not stop ${pid}: ${error.message}`);
              }
            }
            console.log(`load: ${pids.length} busy loops started, ${running} still running at the end of the suite, ${stopped} stopped`);
            if (running < pids.length) console.log("::warning::a busy loop was gone before the suite ended");
          '

      # The per-frame report, from every run: what the two captures and the
      # two GIFs measured, passing or not, so a trend is visible before a
      # failure is.
      - name: Keep the captured-frame report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-report-${{ matrix.os }}-run${{ matrix.run }}
          path: test-results/**/captured-frames.json
          if-no-files-found: ignore
          retention-days: 7

      # Everything, when it fails: the report, the two GIFs, and the captured
      # frames that differed.
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.os }}-run${{ matrix.run }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
