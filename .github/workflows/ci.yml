# Every change, on the three platforms: style, types, unit tests, a build,
# and the end-to-end suite, which launches the real application. The job
# names are the required status checks in docs/repository-settings.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run it supersedes;
# a push to main never cancels another, so every merge keeps its record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The slowest of the last eight runs took 33 minutes (macOS).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Since Electron 42 the npm package fetches no binary; without this
      # step the first electron.launch() in the end-to-end suite would download
      # it against the launch timeout (specs/001, research.md section 3).
      - name: Fetch the Electron binary
        run: npx install-electron --no

      - name: Style
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end suite (Linux, under a display server)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
        env:
          CI: 'true'

      - name: End-to-end suite
        if: runner.os != 'Linux'
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
