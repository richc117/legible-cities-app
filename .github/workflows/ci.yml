# Two layers, each a required check, and a third that is not
# (docs/repository-settings.md, specs/038-test-pyramid/contracts/ci-layers.md).
#
# `ci (<os>)` is the fast layer, on Ubuntu, macOS and Windows for every pull
# request and every push to `main`: style, types, unit tests and a build. It
# launches no Electron and answers in minutes; the unit tests' browser
# project runs in a headless Chromium of Playwright's (ADR-059).
#
# `e2e (<os>)` is the long layer, on macOS and Windows, the two platforms
# people install: the Playwright suite over the real application. It always
# starts and always reports, because a required check that never starts
# blocks the merge for ever and a `paths:` filter makes exactly that. Its
# first step (scripts/ci-decide.mjs) prints the changed paths and the rule
# that judged them; when every path of a pull request is documentation, every
# later step is skipped and the job passes in under two minutes with a
# notice. A push to `main` always runs the suite. There is no Ubuntu leg of
# it; determinism.yml and e2e-loop.yml keep Ubuntu as an option.
#
# `e2e-quarantine (<os>)` runs only the tests tagged `@quarantine` (the flaky
# test policy in CONTRIBUTING.md, issue 553), on the same two platforms and
# with the same steps. It is not a required check and never fails the run, so
# a quarantined test stays measured without blocking a merge; the required
# `e2e` job leaves those tests out with `--grep-invert @quarantine`.
# tests/unit/quarantine.test.ts holds both flags in place.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run it supersedes.
# A push has a group of its own per commit, so no push run is cancelled or
# replaced while pending, and every merge to main keeps its record.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Install, lint, types, units and a build; the end-to-end suite is the
    # other job's.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    # Where Playwright keeps the browser the unit suite's browser project
    # runs in (ADR-059): under the workspace, so that one cache path serves
    # all three platforms, and under node_modules, which nothing lints,
    # formats or commits.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Since Electron 42 the npm package fetches no binary, and the fast
      # layer keeps this step so that both layers start from the same
      # install (contracts/ci-layers.md; specs/001, research.md section 3).
      - name: Fetch the Electron binary
        run: npx install-electron --no

      # The unit suite's browser project (`*.browser.test.tsx`, ADR-059) runs
      # in Playwright's Chromium, not Electron's, and fails rather than skips
      # where it is missing. The browser is Playwright's own build for its
      # version, so the cache is keyed on that version and the platform.
      - name: Read Playwright's version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser for the DOM tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Run on a cache hit too: the download is then skipped, and on Linux
      # the system libraries Chromium needs, which no cache holds, are
      # installed. The browser project runs headless, so the headless shell
      # is all it needs, not the full Chromium beside it.
      - name: Fetch the browser for the DOM tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            npx playwright install chromium --with-deps --only-shell
          else
            npx playwright install chromium --only-shell
          fi

      - name: Style
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Tests that start a Vitest of their own and send signals, kept out of
      # `npm test` for their time (tests/unit/mutations-runner.live.test.ts).
      # They rely on POSIX process groups and signals.
      - name: Live tests of the mutation runner
        if: runner.os != 'Windows'
        run: npm run test:live

      - name: Build
        run: npm run build

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The slowest of the last eight runs took 33 minutes (macOS), build and
    # lint included.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      # The whole history, so that git can diff the pull request's base
      # against its head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Prints the changed paths and the rule that judged them, and sets
      # `run`. Every step after it is gated on that output being anything
      # but 'false', so a step that failed to set it runs the suite.
      - name: Decide whether the suite runs
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-decide.mjs --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Install
        if: steps.decide.outputs.run != 'false'
        run: npm ci

      # Since Electron 42 the npm package fetches no binary; without this
      # step the first electron.launch() in the end-to-end suite would download
      # it against the launch timeout (specs/001, research.md section 3).
      - name: Fetch the Electron binary
        if: steps.decide.outputs.run != 'false'
        run: npx install-electron --no

      - name: Build
        if: steps.decide.outputs.run != 'false'
        run: npm run build

      - name: End-to-end suite
        if: steps.decide.outputs.run != 'false'
        run: npm run test:e2e -- --grep-invert @quarantine
        env:
          CI: 'true'

      - name: Keep the failure evidence
        if: failure() && steps.decide.outputs.run != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  e2e-quarantine:
    name: e2e-quarantine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Not a required check, and a red run is a record, not a block: the
    # tests tagged `@quarantine` are the ones the required job leaves out
    # (CONTRIBUTING.md, "Flaky tests"). With no test tagged, the suite finds
    # nothing and passes in a minute or two.
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      # The same steps as `e2e`, so that a documentation-only pull request
      # skips this job's suite by the same rule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Decide whether the suite runs
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-decide.mjs --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Install
        if: steps.decide.outputs.run != 'false'
        run: npm ci

      - name: Fetch the Electron binary
        if: steps.decide.outputs.run != 'false'
        run: npx install-electron --no

      - name: Build
        if: steps.decide.outputs.run != 'false'
        run: npm run build

      # `--pass-with-no-tests`: Playwright exits with an error when a filter
      # matches nothing, and nothing tagged is the usual state.
      - name: Quarantined end-to-end tests
        if: steps.decide.outputs.run != 'false'
        run: npm run test:e2e -- --grep @quarantine --pass-with-no-tests
        env:
          CI: 'true'

      - name: Keep the failure evidence
        if: failure() && steps.decide.outputs.run != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarantine-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
