# The installers: a dmg for each Mac and an nsis installer for Windows, each
# carrying the pinned engine runtime, LOOM and ffmpeg for its target
# (specs/002-vendored-components-and-installers, ADR-035); and, on a release
# tag, a draft GitHub Release carrying them (specs/025-release-on-a-tag,
# ADR-041).
#
# One run, no fetch from another: the vendor jobs run here, through
# vendor.yml's workflow_call, and each packaging job takes its target's
# artefacts from this same run. They cannot be stale, because they were
# built from the pins this run checked out; the manifest records the pins'
# hash all the same, and the packager's afterPack hook refuses a manifest
# written from any other.
#
# A target whose components are missing, stale or the wrong architecture
# fails, naming the component, and uploads nothing; the other targets go on
# (SC-005). So the packaging jobs run whatever the vendor jobs' result, and
# a download that finds no artefact is left for scripts/check-vendored.mjs
# to name.
#
# Unsigned (FR-005): the Mac app is signed ad hoc and the Windows installer
# not at all, until the release-readiness gate (A6-05). The ffmpeg they
# carry is this repository's own build (issue 95, ADR-040).
#
# This runs on request, on a push to any branch that changes what it
# packages or how the app finds it, src/main and the npm manifests included,
# so every Dependabot npm branch builds the installers too (ADR-035), and on
# every pushed tag that starts with v. GitHub does not evaluate path filters
# for a tag push, so a tag builds whatever changed; and a push trigger that
# names tags and no branches would stop running for branches, which is why
# both are listed. Installers built on main are kept 30 days, on any other
# ref 7.
#
# The release job runs only for a pushed tag, and only when the vendor jobs
# and all three packaging jobs succeeded: a Release has every installer and
# every source archive, or does not exist. It is the only job that can
# write to the repository. scripts/release.mjs refuses a tag that is not
# v<version> or v<version>-rc.<N> for package.json's version, that has been
# moved or deleted since the push that started the run, or whose commit is
# not on main, before anything is drafted; it drafts, and never publishes:
# the maintainer reads the draft and publishes it by hand. An -rc.N tag's
# draft is a prerelease. A rerun updates the draft in place and keeps its
# notes; a published Release for the tag fails the job and is not touched. The
# assets are the three installers renamed for their machine, one archive of
# each Corresponding Source artefact (ffmpeg-source, loom-source with the
# loom-windows-toolchain record inside, engine-source), and SHA256SUMS.txt; the notes are .github/release-notes.md
# filled from vendor/pins.json and the tag. `npm run dist` stays the
# everyday unpacked build.
name: build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    # Evaluated for branches only: GitHub ignores path filters on a tag push.
    paths:
      - 'vendor/pins.json'
      - 'electron-builder.yml'
      # How the app finds its components, and the packager's own version.
      - 'src/main/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/vendor-python.sh'
      - 'scripts/vendor-ffmpeg.sh'
      - 'scripts/vendor-signature.sh'
      - 'scripts/check-vendored.mjs'
      - 'scripts/launch-packaged.mjs'
      - '.github/workflows/vendor.yml'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  vendor:
    uses: ./.github/workflows/vendor.yml

  package:
    name: package (${{ matrix.target }})
    needs: vendor
    # Every target is packaged whatever the vendor jobs' result: one target's
    # failure must not cost the others their installers.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       target: darwin-arm64, builder: '--mac dmg --arm64', installer: 'release/*.dmg' }
          - { os: macos-15-intel, target: darwin-x64,   builder: '--mac dmg --x64',   installer: 'release/*.dmg' }
          - { os: windows-latest, target: win-x64,      builder: '--win nsis --x64',  installer: 'release/*.exe' }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the app
        run: npm run build

      # Each into its own folder, named as vendor.yml uploads it. A missing
      # artefact does not end the job here: the check below names it.
      - name: Download the runtime
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: python-${{ matrix.target }}
          path: vendor/python/${{ matrix.target }}
      - name: Download LOOM
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: loom-${{ matrix.target }}
          path: vendor/loom/${{ matrix.target }}
      - name: Download ffmpeg
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-${{ matrix.target }}
          path: vendor/ffmpeg/${{ matrix.target }}

      - name: Restore the executable bits the artefact zip dropped
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # ADR-038: an artefact is a zip, which keeps no mode. Only what is
          # there is touched; what is not is the check's to report.
          for pattern in "vendor/python/$TARGET/python/bin/*" "vendor/loom/$TARGET/*" "vendor/ffmpeg/$TARGET/*"; do
            for file in $pattern; do
              if [ -f "$file" ]; then chmod +x "$file"; fi
            done
          done

      - name: Refuse a missing, stale or wrong-architecture component, and write the manifest
        shell: bash
        run: node scripts/check-vendored.mjs "$TARGET"

      - name: Compile the runtime's bytecode
        shell: bash
        run: |
          # Unchecked hashes, so a copy that gives every source a new time -
          # the packager's, an installer's - leaves the bytecode valid, and
          # the first start writes nothing into the bundle. -f replaces the
          # timestamped files the compiler's own imports would otherwise have
          # written first and then kept; PYTHONDONTWRITEBYTECODE stops those
          # being written at all.
          case "$TARGET" in
            win-*) py="vendor/python/$TARGET/python/python.exe"; lib="vendor/python/$TARGET/python/Lib" ;;
            *)     py="vendor/python/$TARGET/python/bin/python3"; lib="vendor/python/$TARGET/python/lib" ;;
          esac
          PYTHONDONTWRITEBYTECODE=1 "$py" -m compileall -f -q -j 0 --invalidation-mode unchecked-hash "$lib"
          echo "compiled: $(find "$lib" -name '*.pyc' | wc -l | tr -d ' ') bytecode files"

      - name: Package
        shell: bash
        env:
          # Makes every component required in the afterPack hook.
          LEGIBLE_VENDOR_TARGET: ${{ matrix.target }}
          BUILDER_ARGS: ${{ matrix.builder }}
        # Unquoted on purpose: the matrix holds three words for the packager.
        run: npx electron-builder $BUILDER_ARGS --publish never

      - name: Launch the packaged app once
        shell: bash
        env:
          CI: 'true'
        run: node scripts/launch-packaged.mjs "$TARGET"

      - name: Verify the Mac app's signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Ad hoc, but whole: every nested binary sealed, nothing changed
          # since. Run after the launch check, so a write inside the bundle
          # the snapshot missed still fails here.
          case "$TARGET" in
            darwin-arm64) app="release/mac-arm64/Legible Cities.app" ;;
            *)            app="release/mac/Legible Cities.app" ;;
          esac
          codesign --verify --deep --strict --verbose=2 "$app"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          path: |
            ${{ matrix.installer }}
            vendor/manifest-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  release:
    name: release (draft)
    needs: [vendor, package]
    # A pushed tag only, never a branch, a pull request or a dispatch, and
    # only when every vendor job and all three packaging jobs succeeded.
    # !cancelled() stands in for the default success(), so the results are
    # read here rather than implied.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.vendor.result == 'success'
      && needs.package.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # The one job that can write: to create and edit the draft and upload its
    # assets. Every other job keeps the workflow's contents: read.
    permissions:
      contents: write
    # Two runs for one tag (a rerun while the first is drafting) take turns.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
    # The actions here are pinned to full commits, the version in the
    # comment: checkout and setup-node take github.token as their default
    # token input in the one job that can write. download-artifact does
    # not; it reads this run's artefacts with the runner's own token.
    steps:
      # The whole history, so the tag's commit can be tested against main's.
      # checkout uses the token to fetch and, with persist-credentials off,
      # leaves none in git's configuration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-node uses the token only to read Node's version list.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # The checkout forces the local tag to this run's commit, so the script
      # asks origin where the tag points now (a public read, no token) and
      # refuses a tag moved or deleted since the push that started the run.
      - name: Refuse a tag not for package.json's version, moved since, or not on main
        id: decide
        shell: bash
        run: node scripts/release.mjs decide "$TAG" --main refs/remotes/origin/main --remote origin --run-commit "$GITHUB_SHA"

      # Each into a folder named for its artefact, by name rather than by
      # pattern: a pattern that matches one artefact unpacks it without the folder.
      - name: Download the darwin-arm64 installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-darwin-arm64
          path: downloaded/installer-darwin-arm64
      - name: Download the darwin-x64 installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-darwin-x64
          path: downloaded/installer-darwin-x64
      - name: Download the win-x64 installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-win-x64
          path: downloaded/installer-win-x64
      - name: Download FFmpeg's Corresponding Source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-source
          path: downloaded/ffmpeg-source
      - name: Download LOOM's Corresponding Source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loom-source
          path: downloaded/loom-source
      - name: Download the record of what the Windows LOOM tools link
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loom-windows-toolchain
          path: downloaded/loom-windows-toolchain
      - name: Download the engine's source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-source
          path: downloaded/engine-source

      - name: Assemble the assets and their checksums
        shell: bash
        run: node scripts/release.mjs assemble "$TAG" downloaded release-assets

      - name: Write the notes from the template
        shell: bash
        run: node scripts/release.mjs notes "$TAG" "$RUNNER_TEMP/notes.md"

      # The only step of this repository's own that holds the token. Nothing
      # is written before the script has judged what GitHub already has for
      # the tag, and the draft is read back and compared with the files
      # afterwards.
      - name: Create or update the draft, upload the assets, and check them
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.decide.outputs.name }}
          PRERELEASE: ${{ steps.decide.outputs.prerelease }}
        run: |
          set -euo pipefail
          listing="$RUNNER_TEMP/releases.jsonl"
          list() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | {id, tag_name, draft, prerelease, assets: [.assets[] | {name, size, digest}]}' > "$listing"
          }
          list
          plan=$(node scripts/release.mjs existing "$TAG" "$listing" release-assets)
          action=$(jq -r .action <<< "$plan")
          prerelease_flag=()
          if [ "$PRERELEASE" = true ]; then prerelease_flag=(--prerelease); fi
          case "$action" in
            create)
              echo "drafting $NAME for $TAG"
              gh release create "$TAG" --draft --verify-tag --title "$NAME" \
                --notes-file "$RUNNER_TEMP/notes.md" "${prerelease_flag[@]}"
              ;;
            update)
              # The notes are left alone: the maintainer may have edited them
              # in the draft, and a rerun must not put the template back.
              echo "updating the draft $NAME for $TAG (id $(jq -r .id <<< "$plan")); its notes are kept"
              gh release edit "$TAG" --draft=true --prerelease="$PRERELEASE" --title "$NAME"
              while IFS= read -r stale; do
                if [ -n "$stale" ]; then
                  echo "removing $stale, which this run does not attach"
                  gh release delete-asset "$TAG" "$stale" --yes
                fi
              done < <(jq -r '.stale[]' <<< "$plan")
              ;;
            *)
              echo "::error::release.mjs answered $plan"
              exit 1
              ;;
          esac
          gh release upload "$TAG" release-assets/* --clobber
          list
          node scripts/release.mjs verify "$TAG" "$listing" release-assets
          {
            echo "### Draft: $NAME"
            echo
            echo "Not published. Read it on the repository's Releases page, then publish it by hand."
            echo
            echo '~~~'
            cat release-assets/SHA256SUMS.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
