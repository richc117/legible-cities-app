# The installers: a dmg for each Mac and an nsis installer for Windows, each
# carrying the pinned engine runtime, LOOM and ffmpeg for its target
# (specs/002-vendored-components-and-installers, ADR-035); and, on a release
# tag, a draft GitHub Release carrying them (specs/025-release-on-a-tag,
# ADR-041).
#
# One run, no fetch from another: the vendor jobs run here, through
# vendor.yml's workflow_call, and each packaging job takes its target's
# artefacts from this same run. They cannot be stale, because they were
# built from the pins this run checked out; the manifest records the pins'
# hash all the same, and the packager's afterPack hook refuses a manifest
# written from any other.
#
# A target whose components are missing, stale or the wrong architecture
# fails, naming the component, and uploads nothing; the other targets go on
# (SC-005). So the packaging jobs run whatever the vendor jobs' result, and
# a download that finds no component is left for scripts/check-vendored.mjs
# to name. The source of Electron's FFmpeg library is the exception: every
# installer carries that library, so a packaging job refuses, itself and
# before anything is installed, a run without the electron-ffmpeg-source
# artefact, and no target is packaged (ADR-043).
#
# Signing (ADR-062). Every branch and pull-request build signs the Mac app ad
# hoc, as electron-builder.yml says, and holds no secret. So does a v tag
# while the repository variable MAC_SIGNING is not `on`, which is how a
# candidate is cut before there is a certificate to sign it with. Signing
# mode needs all of: that variable on, a Mac target, and a pushed tag that
# starts with v or a dispatch with `sign` ticked. Only then is a job in an
# environment, whose deployment rule and required reviewer stand between a
# run and its secrets. Two jobs are, each in an environment of its own that
# holds its half of the secrets and nothing of the other's:
#
#   package    in `release-signing`, which holds the Developer ID
#              certificate. electron-builder signs with it, from
#              electron-builder.release.yml, so the certificate is in the
#              step that runs the packager and its hooks, which is npm's
#              code. The signed image is uploaded as unnotarised-<target>.
#   notarize   in `release-notarize`, which holds the notary's key. A fresh
#              runner that checks out the two scripts and the release config
#              and nothing else, installs nothing and runs no npm code: it
#              downloads the signed image, notarises and staples it, checks
#              it the way a Mac will, and uploads it as installer-<target>.
#
# A later step of the packaging job would not have kept the key from that
# job's npm code: an earlier step can leave a PATH entry, a BASH_ENV or a
# process behind for a later one to meet. Another runner has none of them.
# And one environment for both would have left the key within the packaging
# job's reach, to be kept from it only by what the job happens to name: a
# job cannot be handed a secret of an environment it is not in, so the
# notary's key is out of the packaging job's reach by where it is kept, and
# the certificate out of the notarising job's. The release, attest and
# verify jobs take installer-<target> as they always did, so they see the
# stapled bytes. The Windows installer is not signed (ADR-054). The ffmpeg
# the installers carry is this repository's own build (issue 95, ADR-040).
#
# This runs on request, on a push to any branch that changes what it
# packages or how the app finds it, src/main and the npm manifests included,
# so every Dependabot npm branch builds the installers too (ADR-035), and on
# every pushed tag that starts with v. GitHub does not evaluate path filters
# for a tag push, so a tag builds whatever changed; and a push trigger that
# names tags and no branches would stop running for branches, which is why
# both are listed. Installers built on main are kept 30 days, on any other
# ref 7.
#
# The release job runs only for a pushed tag, and only when the vendor jobs
# and all three packaging jobs succeeded, and in signing mode both
# notarising jobs too: a Release has every installer and
# every source archive, or does not exist. It is the only job that can
# write to the repository. scripts/release.mjs refuses a tag that is not
# v<version> or v<version>-rc.<N> for package.json's version, that has been
# moved or deleted since the push that started the run, or whose commit is
# not on main, before anything is drafted; it drafts, and never publishes:
# the maintainer reads the draft and publishes it by hand. An -rc.N tag's
# draft is a prerelease. A rerun updates the draft in place and keeps its
# notes; a published Release for the tag fails the job and is not touched. The
# assets are the three installers renamed for their machine, one archive of
# each Corresponding Source artefact (ffmpeg-source, loom-source with the
# loom-windows-toolchain record inside, engine-source), the source archive of
# Electron's FFmpeg library as electron-ffmpeg-source made it (ADR-043), and
# SHA256SUMS.txt; the notes are .github/release-notes.md
# filled from vendor/pins.json and the tag. `npm run dist` stays the
# everyday unpacked build.
name: build

on:
  workflow_dispatch:
    inputs:
      # Signing mode for the two Mac targets (ADR-062). Off unless asked for:
      # a plain dispatch builds what a branch push builds. It also needs the
      # repository variable MAC_SIGNING to be `on`; while it is not, a
      # dispatch that ticks this is refused, in its first minute.
      sign:
        description: 'Sign the Mac installers with the Developer ID and notarise them (needs the MAC_SIGNING variable on; waits for approval twice, to sign and to notarise)'
        type: boolean
        default: false
  push:
    branches: ['**']
    tags: ['v*']
    # Evaluated for branches only: GitHub ignores path filters on a tag push.
    paths:
      - 'vendor/pins.json'
      - 'electron-builder.yml'
      # The Developer ID build's three keys, and the two scripts that
      # notarise the disk image and check either signature (ADR-062).
      - 'electron-builder.release.yml'
      - 'scripts/notarize-dmg.mjs'
      - 'scripts/verify-mac-signing.mjs'
      # The packager's build resources: the NSIS include that removes the
      # installer's copy of itself (issue 128).
      - 'build/**'
      # The brand art the installers are drawn from: the app icons, the
      # disk image's background, the installer's icons (issue 140).
      - 'assets/brand/**'
      # How the app finds its components, and the packager's own version.
      - 'src/main/**'
      # What the app reports as its version, built in by the config from
      # release.mjs's releaseLabel (issue 558).
      - 'electron.vite.config.ts'
      - 'scripts/release.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/vendor-python.sh'
      - 'scripts/vendor-python-licences.sh'
      # The runtime's locked packages and what writes them (issue 434). A
      # move of the manifest moves its hash in the pins too, but a branch
      # that changes only the script still packages.
      - 'vendor/python-requirements.txt'
      - 'scripts/lock-python.sh'
      - 'scripts/vendor-ffmpeg.sh'
      - 'scripts/vendor-signature.sh'
      - 'scripts/electron-ffmpeg-source.sh'
      - 'scripts/check-vendored.mjs'
      - 'scripts/launch-packaged.mjs'
      - '.github/workflows/vendor.yml'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  vendor:
    uses: ./.github/workflows/vendor.yml

  package:
    name: package (${{ matrix.target }})
    needs: vendor
    # Every target is packaged whatever the vendor jobs' result: one target's
    # failure must not cost the others their installers. The one exception is
    # the source of Electron's FFmpeg library, which every installer carries:
    # without it no target is packaged (the first steps below).
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Signing mode (ADR-062): a Mac target, with the repository variable
    # MAC_SIGNING on, on a pushed v* tag or on a dispatch that asked for it.
    # Only then is the job in the release-signing environment, which holds
    # the certificate, and nothing else, behind its deployment rule and its
    # required reviewer. For every other run the expression is the empty
    # string, which is no environment at all: no deployment, no approval, no
    # secret. So a v tag pushed while the variable is off builds ad hoc, as
    # every tag did before there was anything to sign with. The condition is
    # written here and for SIGN below, because a job's `environment` cannot
    # read its `env`, and again, without the target, for the notarize job;
    # a unit test holds every copy to the same text.
    environment: ${{ startsWith(matrix.target, 'darwin-') && vars.MAC_SIGNING == 'on' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign == true)) && 'release-signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       target: darwin-arm64, builder: '--mac dmg --arm64', installer: 'release/*.dmg' }
          - { os: macos-15-intel, target: darwin-x64,   builder: '--mac dmg --x64',   installer: 'release/*.dmg' }
          - { os: windows-latest, target: win-x64,      builder: '--win nsis --x64',  installer: 'release/*.exe' }
    env:
      TARGET: ${{ matrix.target }}
      # 'true' in signing mode and 'false' otherwise; the steps that sign and
      # check a signed build read it, and so does the name the installer is
      # uploaded under.
      SIGN: ${{ startsWith(matrix.target, 'darwin-') && vars.MAC_SIGNING == 'on' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign == true)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A dispatch that ticks `sign` while the variable is off would build ad
      # hoc and say nothing: the person asked for a signed build, so it is
      # refused, at once. A v tag is different: with the variable off it
      # builds ad hoc on purpose.
      - name: Refuse a dispatch that asks to sign while MAC_SIGNING is not on
        if: ${{ startsWith(matrix.target, 'darwin-') && github.event_name == 'workflow_dispatch' && inputs.sign == true && vars.MAC_SIGNING != 'on' }}
        shell: bash
        run: |
          echo "::error::this dispatch asked to sign, and the repository variable MAC_SIGNING is not 'on', so nothing here would be signed. Turn it on once both environments exist, each with its rule, its reviewer and its secrets (docs/repository-settings.md), or dispatch without sign"
          exit 1

      # Signing mode only, and first, so a run that cannot sign stops before
      # anything is installed or built. No secret is handed to this step:
      # each line says only whether the environment gave one, worked out
      # before the shell starts. A missing environment, or a job outside it,
      # reads as empty secrets. The notary's key is not asked about here: it
      # is another environment's, which this job is never in, and the
      # notarize job refuses for itself. TEAMID_TBD is the placeholder
      # electron-builder.release.yml holds until the Team ID is written in.
      - name: Refuse to sign without the certificate and the Team ID
        if: env.SIGN == 'true'
        shell: bash
        env:
          HAS_MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          HAS_MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD != '' }}
        run: |
          missing=''
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD; do
            has="HAS_$name"
            if [ "${!has:-}" != true ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::signing mode, and the release-signing environment gave this job no value for:$missing"
            exit 1
          fi
          team=$(sed -n "s/^  identity: '\([^']*\)'.*$/\1/p" electron-builder.release.yml)
          if [ "$team" = TEAMID_TBD ]; then
            echo "::error::electron-builder.release.yml still names the placeholder TEAMID_TBD as its identity: write the Developer ID Team ID there before signing"
            exit 1
          fi
          if ! LC_ALL=C grep -Eq '^[A-Z0-9]{10}$' <<< "$team"; then
            echo "::error::electron-builder.release.yml's mac.identity is not a Team ID (ten capital letters and digits, in single quotes), so there is no certificate to ask for"
            exit 1
          fi
          echo "signing mode: every secret this job is given has a value, and the identity is team $team"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The installers carry Electron's FFmpeg library (libffmpeg.dylib,
      # ffmpeg.dll), whose source the vendor workflow's electron-ffmpeg-source
      # job verifies and archives. As the ffmpeg and LOOM jobs need their
      # source jobs, no installer is packaged without it (issue 109, ADR-043):
      # the artefact exists only when that job succeeded, and it must be the
      # archive for the Electron package-lock.json installs. Downloaded first,
      # so a run without it stops before anything is installed.
      - name: Download the source of Electron's FFmpeg library
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: electron-ffmpeg-source
          path: electron-ffmpeg-source
      - name: Refuse to package without the source of Electron's FFmpeg library
        shell: bash
        run: |
          electron=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")
          archive="electron-ffmpeg-source/electron-ffmpeg-$electron-source.tar.xz"
          if [ ! -s "$archive" ]; then
            echo "::error::$archive is not in this run: the vendor workflow's electron-ffmpeg-source job failed, or the download did. An installer carrying Electron $electron's FFmpeg library is not packaged without that library's source"
            exit 1
          fi
          echo "the source of Electron $electron's FFmpeg library: $(wc -c < "$archive" | tr -d ' ') bytes"

      - name: Install
        run: npm ci

      # The Mac app's copies of Electron's and Chromium's licences come from
      # the Electron binary in node_modules, which npm ci no longer fetches;
      # electron-builder deletes its own from a Mac app (electron-builder.yml).
      - name: Fetch Electron, for its licences
        if: runner.os == 'macOS'
        run: npx install-electron --no

      - name: Build the app
        run: npm run build
        env:
          LEGIBLE_RELEASE_REF: ${{ github.ref }}

      # Each into its own folder, named as vendor.yml uploads it. A missing
      # artefact does not end the job here: the check below names it.
      - name: Download the runtime
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-${{ matrix.target }}
          path: vendor/python/${{ matrix.target }}
      - name: Download LOOM
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-${{ matrix.target }}
          path: vendor/loom/${{ matrix.target }}
      - name: Download ffmpeg
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-${{ matrix.target }}
          path: vendor/ffmpeg/${{ matrix.target }}

      - name: Restore the executable bits the artefact zip dropped
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # ADR-038: an artefact is a zip, which keeps no mode. Only what is
          # there is touched; what is not is the check's to report.
          for pattern in "vendor/python/$TARGET/python/bin/*" "vendor/loom/$TARGET/*" "vendor/ffmpeg/$TARGET/*"; do
            for file in $pattern; do
              if [ -f "$file" ]; then chmod +x "$file"; fi
            done
          done

      - name: Refuse a missing, stale or wrong-architecture component, and write the manifest
        shell: bash
        run: node scripts/check-vendored.mjs "$TARGET"

      - name: Compile the runtime's bytecode
        shell: bash
        run: |
          # Unchecked hashes, so a copy that gives every source a new time -
          # the packager's, an installer's - leaves the bytecode valid, and
          # the first start writes nothing into the bundle. -f replaces the
          # timestamped files the compiler's own imports would otherwise have
          # written first and then kept; PYTHONDONTWRITEBYTECODE stops those
          # being written at all.
          case "$TARGET" in
            win-*) py="vendor/python/$TARGET/python/python.exe"; lib="vendor/python/$TARGET/python/Lib" ;;
            *)     py="vendor/python/$TARGET/python/bin/python3"; lib="vendor/python/$TARGET/python/lib" ;;
          esac
          PYTHONDONTWRITEBYTECODE=1 "$py" -m compileall -f -q -j 0 --invalidation-mode unchecked-hash "$lib"
          echo "compiled: $(find "$lib" -name '*.pyc' | wc -l | tr -d ' ') bytecode files"

      # The certificate reaches electron-builder in signing mode only, and
      # under electron-builder's own names only inside that branch of the
      # shell. There it is, plainly, in the hands of npm's code: the
      # packager, everything it depends on and this repository's afterPack
      # hook run with the certificate and its password in their environment.
      # That is what letting electron-builder sign costs, and why the
      # notary's key is kept out of this job altogether (ADR-062). The two
      # values below are empty in every other run, where the job is in no
      # environment, and electron-builder does not read these names. They
      # must never be given at the step as its own names: an empty one of
      # those is read as a certificate to load, which fails every Mac build,
      # the ad-hoc ones included. And no variable of electron-builder's for
      # the notary is set anywhere in this workflow: with one it would
      # notarise the app itself, here (electron-builder.release.yml).
      - name: Package
        shell: bash
        env:
          # Makes every component required in the afterPack hook.
          LEGIBLE_VENDOR_TARGET: ${{ matrix.target }}
          BUILDER_ARGS: ${{ matrix.builder }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        # $BUILDER_ARGS is unquoted on purpose: the matrix holds three words
        # for the packager.
        run: |
          if [ "$SIGN" = true ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            unset MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD
            npx electron-builder $BUILDER_ARGS --config electron-builder.release.yml --publish never
          else
            unset MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD
            npx electron-builder $BUILDER_ARGS --publish never
          fi

      - name: Launch the packaged app once
        shell: bash
        env:
          CI: 'true'
        run: node scripts/launch-packaged.mjs "$TARGET"

      - name: Verify the Mac app's signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Whole, whoever signed it: every nested binary sealed, nothing
          # changed since. Run after the launch check, so a write inside the
          # bundle the snapshot missed still fails here. Then what it is
          # signed with: ad hoc, or in signing mode the team's Developer ID,
          # timestamped; and in both the hardened runtime and the
          # entitlement ADR-043 needs kept.
          case "$TARGET" in
            darwin-arm64) app="release/mac-arm64/Legible Cities.app" ;;
            *)            app="release/mac/Legible Cities.app" ;;
          esac
          # Said in every Mac build and judged only in the notarize job,
          # whose verdicts rest on it: whether Gatekeeper's assessments are
          # on for these runners (ADR-062).
          echo "Gatekeeper on this runner: $(spctl --status 2>&1 || true)"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$SIGN" = true ]; then
            node scripts/verify-mac-signing.mjs developer-id "$app" --team-from electron-builder.release.yml
          else
            node scripts/verify-mac-signing.mjs adhoc "$app"
          fi

      # Issue 128: electron-builder's template copies the running installer
      # into %LOCALAPPDATA%\<package name>-updater, for an updater this app
      # does not have, and its uninstaller leaves the copy behind.
      # build/installer.nsh removes it straight after the copy and again on
      # uninstall. This installs the installer just built, silently, as
      # acceptance.yml's steps 2 and 21 do, and holds it to both. Any new
      # folder named *-updater under %LOCALAPPDATA% counts, not only the
      # expected name, so a change in how electron-builder names the folder
      # cannot pass the check by having it look in the wrong place. Before
      # the uninstall a stand-in copy is put where an older installer left
      # one, so the uninstaller's removal is proved and not only the
      # installer's.
      - name: Install and uninstall the Windows installer, and look for what is left
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path release -File | Where-Object { $_.Extension -eq '.exe' })
          if ($installers.Count -ne 1) {
            $installers | Format-Table Name | Out-Host
            throw "expected one installer in release, found $($installers.Count)"
          }
          $installer = $installers[0].FullName
          $name = node -p "require('./package.json').name"
          $folder = Join-Path $env:LOCALAPPDATA "Programs\$name"
          $updater = Join-Path $env:LOCALAPPDATA "$name-updater"
          $exe = Join-Path $folder 'Legible Cities.exe'
          $uninstaller = Join-Path $folder 'Uninstall Legible Cities.exe'
          function Get-NewUpdaterFolders([string[]] $Before) {
            @(Get-ChildItem -Path $env:LOCALAPPDATA -Directory -Filter '*-updater' -ErrorAction SilentlyContinue |
              ForEach-Object FullName | Where-Object { $Before -notcontains $_ })
          }
          function Get-Present([string[]] $Paths) {
            @($Paths | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique)
          }
          foreach ($path in @($folder, $updater)) {
            if (Test-Path -LiteralPath $path) { throw "$path exists before the install: this runner is not clean" }
          }
          $before = @(Get-NewUpdaterFolders @())

          Write-Output "installing $installer"
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the installer exited $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $exe)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | Format-Table Name | Out-Host
            throw "the installer exited 0 and there is no $exe"
          }
          Write-Output "installed: $exe"
          $kept = @(Get-Present (@($updater) + @(Get-NewUpdaterFolders $before)))
          if ($kept.Count -gt 0) {
            foreach ($path in $kept) { Get-ChildItem -LiteralPath $path -Recurse -Force | Format-Table FullName, Length | Out-Host }
            throw "while installed, the installer kept a copy of itself in $($kept -join ', '); build/installer.nsh's customInstall should have removed it (issue 128)"
          }
          Write-Output "while installed: no $updater, and no other new *-updater folder"

          # What an installer from before issue 128 left, so the uninstaller
          # has a copy to remove.
          New-Item -ItemType Directory -Path $updater | Out-Null
          Set-Content -LiteralPath (Join-Path $updater 'installer.exe') -Value 'a stand-in for an older installer''s copy'

          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "no uninstaller at $uninstaller" }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          Write-Output "the uninstaller exited $($process.ExitCode)"
          # An NSIS uninstaller copies itself out of the folder and goes on
          # from there, so its end is the folders going, within a deadline.
          $deadline = (Get-Date).AddMinutes(3)
          while (@(Get-Present @($folder, $updater)).Count -gt 0 -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          $left = @(Get-Present (@($folder, $updater) + @(Get-NewUpdaterFolders $before)))
          if ($left.Count -gt 0) {
            throw "after the uninstall, still there: $($left -join ', '); build/installer.nsh's customUnInstall should have removed the updater folder (issue 128)"
          }
          Write-Output "after the uninstall: neither $folder nor $updater, and no other new *-updater folder"

      # In signing mode a Mac's image is signed and not yet notarised: it goes
      # up under another name, for the notarize job alone, which uploads
      # installer-<target> itself once the image is stapled. So nothing
      # downstream can take an unnotarised image for the installer. Every
      # other installer is final here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SIGN == 'true' && 'unnotarised' || 'installer' }}-${{ matrix.target }}
          path: |
            ${{ matrix.installer }}
            vendor/manifest-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  # Signing mode only (ADR-062): notarise each signed Mac image, staple the
  # ticket to it, check it the way a person's Mac will, and upload it as the
  # installer. A job of its own, on a runner of its own, because this is
  # where the notary's key is: nothing from npm is installed or run here,
  # and the checkout is the two scripts and the release config and nothing
  # else, so the only code beside the key is those two files, which import
  # nothing but Node's own modules, and the pinned actions. What it takes
  # from the packaging job is one file, the signed image, which it never
  # runs: it is hashed, submitted, mounted read-only and judged.
  #
  # Its environment is release-notarize, which holds the notary's key and
  # nothing else, and which no other job joins. The packaging job's is
  # release-signing, which holds the certificate and nothing else. So
  # neither job can be handed the other's secrets, whatever either names:
  # they are not in an environment it is in.
  #
  # The condition is the packaging job's, without the target: this job's
  # matrix is the two Macs. On every other run the job is skipped, and its
  # `environment` is the empty string besides, so a branch build never names
  # the environment. It needs every packaging job to have succeeded: an
  # image is not sent to Apple, nor a reviewer asked, for a run that could
  # not be released whole.
  notarize:
    name: notarize (${{ matrix.target }})
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' && vars.MAC_SIGNING == 'on' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign == true)) }}
    runs-on: ${{ matrix.os }}
    # The two limited steps below, 90 and 80 minutes, and the transfers
    # around them. A run that is going well takes a few minutes.
    timeout-minutes: 180
    environment: ${{ vars.MAC_SIGNING == 'on' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign == true)) && 'release-notarize' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      # Three files and nothing else: no package.json to install from, no
      # other script to run by mistake.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/notarize-dmg.mjs
            scripts/verify-mac-signing.mjs
            electron-builder.release.yml
          sparse-checkout-cone-mode: false

      # Before anything is downloaded or sent. No secret is handed to this
      # step either: each line says only whether the environment gave one.
      # The Team ID is not asked about again: the packaging job refused the
      # placeholder for this same commit, and the script that checks the
      # image refuses it for itself.
      - name: Refuse to notarise without the notary's key
        shell: bash
        env:
          HAS_NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 != '' }}
          HAS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID != '' }}
          HAS_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID != '' }}
        run: |
          missing=''
          for name in NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            has="HAS_$name"
            if [ "${!has:-}" != true ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::signing mode, and the release-notarize environment gave this job no value for:$missing"
            exit 1
          fi
          echo "signing mode: every secret this job is given has a value"

      # Node to run the two scripts with, and no package cache: nothing is
      # installed here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The artefact is the one thing here that came from a runner that ran
      # npm's code, so it is unpacked beside nothing: into a folder of its
      # own under the runner's temporary folder, and never into the
      # workspace, where a file of the right name would replace a script
      # this job is about to run, or the config it trusts for the team, with
      # the notary's key in hand. Its two folders land there as the
      # packaging job had them: release/ with the one image, vendor/ with
      # the target's manifest, which goes back up beside the image.
      - name: Download the signed disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unnotarised-${{ matrix.target }}
          path: ${{ runner.temp }}/signed

      # And it is held to exactly what the packaging job uploads, before
      # anything of it is used and before the notary's key exists: one disk
      # image in release/, the target's manifest in vendor/, both plain
      # files, and nothing else. No link, no third file, no other folder. A
      # name is shown quoted, so that nothing it holds is read by the runner
      # as a command.
      - name: Refuse a download that holds anything but the image and its manifest
        shell: bash
        run: |
          export LC_ALL=C
          root="$RUNNER_TEMP/signed"
          if [ -L "$root" ] || [ ! -d "$root" ]; then
            echo "::error::there is no folder where the signed image is unpacked, so there is nothing to notarise"
            exit 1
          fi
          image='^release/[A-Za-z0-9 ._-]+\.dmg$'
          images=0
          manifests=0
          refused=''
          while IFS= read -r -d '' entry; do
            name="${entry#"$root"/}"
            printf -v quoted '%q' "$name"
            if [ -L "$entry" ]; then
              refused="$refused $quoted (a link)"
            elif [ -d "$entry" ]; then
              case "$name" in
                release|vendor) ;;
                *) refused="$refused $quoted (a folder)" ;;
              esac
            elif [ ! -f "$entry" ]; then
              refused="$refused $quoted (neither a file nor a folder)"
            elif [ "$name" = "vendor/manifest-$TARGET.json" ]; then
              manifests=$((manifests + 1))
            elif [[ "$name" =~ $image ]]; then
              images=$((images + 1))
            else
              refused="$refused $quoted"
            fi
          done < <(find "$root" -mindepth 1 -print0)
          if [ -n "$refused" ] || [ "$images" -ne 1 ] || [ "$manifests" -ne 1 ]; then
            echo "::error::the download is not what the packaging job uploads, which is one disk image in release/ and vendor/manifest-$TARGET.json: it holds $images disk image(s) and $manifests manifest(s)${refused:+, and besides them:$refused}. Nothing of it was used, and the notary's key was not written"
            exit 1
          fi
          echo "the download holds one disk image and vendor/manifest-$TARGET.json, and nothing else"

      # The refusal above sees only what landed in the download's own
      # folder. This holds the workspace itself to the checkout, still
      # before the key exists: at this run's commit, the checked-out files
      # as that commit has them, and nothing beside them, ignored names
      # included. A file that reached the workspace by any road, an archive
      # unpacked outside its folder among them, stops the job here. Git is
      # told to take nothing from the folder it is judging that would run a
      # program: no file-system monitor, no external diff, no conversion.
      - name: Refuse a workspace that is not this run's checkout
        shell: bash
        run: |
          git() { command git -c core.fsmonitor=false "$@"; }
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::the workspace is at commit ${head:0:12} and this run is for ${GITHUB_SHA:0:12}: it is not this run's checkout. Nothing was run, and the notary's key was not written"
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff --no-textconv HEAD --; then
            git status --porcelain --untracked-files=all --ignored
            echo "::error::a checked-out file is not as the commit has it: something wrote over a script or the config this job is about to use with the notary's key. Nothing was run, and the key was not written"
            exit 1
          fi
          stray=$(git status --porcelain --untracked-files=all --ignored)
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo "::error::the workspace holds what the checkout did not put there (listed above), beside the files this job is about to use with the notary's key. Nothing was run, and the key was not written"
            exit 1
          fi
          echo "the workspace is the checkout of ${GITHUB_SHA:0:12}: its files as committed, and nothing beside them"

      # spctl's verdicts mean nothing on a machine where Gatekeeper's
      # assessments are off: everything is accepted, signed or not. A runner
      # image can come that way, so they are turned on here if they are off,
      # the status is said before and after, and only a runner where they
      # will not come on fails. macOS has spelt the option two ways.
      - name: Turn Gatekeeper's assessments on if they are off
        shell: bash
        run: |
          before=$(spctl --status 2>&1 || true)
          echo "Gatekeeper before: $before"
          if [[ "$before" != *'assessments enabled'* ]]; then
            sudo spctl --global-enable || sudo spctl --master-enable || true
          fi
          after=$(spctl --status 2>&1 || true)
          echo "Gatekeeper after: $after"
          if [[ "$after" != *'assessments enabled'* ]]; then
            echo "::error::Gatekeeper's assessments are off on this runner and could not be turned on, so spctl's verdicts here would prove nothing about the image"
            exit 1
          fi

      # The notary's key exists in this step alone: written to a file nobody
      # else can read, handed to the script by path, and removed when the
      # shell exits normally or fails; on a cancelled or timed-out step the
      # hosted runner is discarded with the file. The limit is past the
      # script's own worst case, so the script gives up first and says why:
      # 70 minutes for the submission (notarytool's 60 of waiting and the
      # upload before it), three tries of the log and three of the staple at
      # 2 minutes each with a quarter of a minute between tries, and 1 for
      # the validation, which is 84.
      - name: Notarise and staple the disk image
        timeout-minutes: 90
        shell: bash
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          shopt -s nullglob
          images=("$RUNNER_TEMP/signed/release/"*.dmg)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::expected one disk image in the download's release folder, found ${#images[@]}"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$key"' EXIT
          trap 'exit 1' INT TERM HUP
          printf '%s\n' "$NOTARY_KEY_P8" > "$key"
          unset NOTARY_KEY_P8
          NOTARY_KEY_PATH="$key" node scripts/notarize-dmg.mjs "${images[0]}" --log "$RUNNER_TEMP/notary-log/notary-log-$TARGET.json"

      # What a person will download, checked the way their Mac will check
      # it: the image's signature and staple, Gatekeeper's verdict on it,
      # and the app inside, mounted read-only. The limit is past the sum of
      # the script's own limits on its checks, 77 minutes, for the same
      # reason as above; it takes a few.
      - name: Verify the notarised disk image
        timeout-minutes: 80
        shell: bash
        run: |
          shopt -s nullglob
          images=("$RUNNER_TEMP/signed/release/"*.dmg)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::expected one disk image in the download's release folder, found ${#images[@]}"
            exit 1
          fi
          node scripts/verify-mac-signing.mjs dmg "${images[0]}" --team-from electron-builder.release.yml

      # Whatever the outcome: the log is the only place the notary says what
      # it found.
      - name: Upload the notary's log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-log-${{ matrix.target }}
          path: ${{ runner.temp }}/notary-log/
          if-no-files-found: warn
          retention-days: 30

      # The installer, as the release job takes it: the stapled image and
      # the manifest that came with it, from the folder they were unpacked
      # into, under the name an unsigned build's packaging job uses. The
      # artefact's two folders are what they were there: release/ and
      # vendor/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/signed/release/*.dmg
            ${{ runner.temp }}/signed/vendor/manifest-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  release:
    name: release (draft)
    # MAC_SIGNING flipped between this run's jobs fails closed: a job then
    # looks for an installer-darwin-* or unnotarised-* artefact that the
    # other mode never made, and nothing is drafted.
    needs: [vendor, package, notarize]
    # A pushed tag only, never a branch, a pull request or a dispatch, and
    # only when every vendor job and all three packaging jobs succeeded.
    # !cancelled() stands in for the default success(), so the results are
    # read here rather than implied. The notarising jobs must have succeeded
    # too, unless they were skipped because this is not a signing run, which
    # on a pushed v tag is exactly the variable not being on: a notarising
    # job skipped for any other reason, or failed, drafts nothing.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.vendor.result == 'success'
      && needs.package.result == 'success'
      && (needs.notarize.result == 'success' || (needs.notarize.result == 'skipped' && vars.MAC_SIGNING != 'on')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # The one job that can write: to create and edit the draft and upload its
    # assets. Every other job keeps the workflow's contents: read. It cannot
    # mint an OIDC token: the attest job after it attests the assets, and is
    # the only job that can (issue 434, ADR-057).
    permissions:
      contents: write
    # Two runs for one tag (a rerun while the first is drafting) take turns.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
    # The actions here are pinned to full commits, the version in the
    # comment: checkout and setup-node take github.token as their default
    # token input in the one job that can write. download-artifact and
    # upload-artifact do not; they use the runner's own token for this run's
    # artefacts.
    steps:
      # The whole history, so the tag's commit can be tested against main's.
      # checkout uses the token to fetch and, with persist-credentials off,
      # leaves none in git's configuration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-node uses the token only to read Node's version list.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The checkout forces the local tag to this run's commit, so the script
      # asks origin where the tag points now (a public read, no token) and
      # refuses a tag moved or deleted since the push that started the run.
      - name: Refuse a tag not for package.json's version, moved since, or not on main
        id: decide
        shell: bash
        run: node scripts/release.mjs decide "$TAG" --main refs/remotes/origin/main --remote origin --run-commit "$GITHUB_SHA"

      # Each into a folder named for its artefact, by name rather than by
      # pattern: a pattern that matches one artefact unpacks it without the folder.
      - name: Download the darwin-arm64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-darwin-arm64
          path: downloaded/installer-darwin-arm64
      - name: Download the darwin-x64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-darwin-x64
          path: downloaded/installer-darwin-x64
      - name: Download the win-x64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-win-x64
          path: downloaded/installer-win-x64
      - name: Download FFmpeg's Corresponding Source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-source
          path: downloaded/ffmpeg-source
      - name: Download LOOM's Corresponding Source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-source
          path: downloaded/loom-source
      - name: Download the record of what the Windows LOOM tools link
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-windows-toolchain
          path: downloaded/loom-windows-toolchain
      - name: Download the engine's source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-source
          path: downloaded/engine-source
      - name: Download the source of Electron's FFmpeg library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: electron-ffmpeg-source
          path: downloaded/electron-ffmpeg-source

      - name: Assemble the assets and their checksums
        shell: bash
        run: node scripts/release.mjs assemble "$TAG" downloaded release-assets

      # The assets as they are about to be drafted, for the attest job: the
      # same folder the draft is uploaded from, once SHA256SUMS.txt is written
      # and before anything is drafted, and nothing writes into it after. The
      # attest job holds every file to its line in SHA256SUMS.txt, and the
      # step below holds every uploaded asset to the same files by GitHub's
      # digest, so the bytes attested are the bytes the draft carries. A
      # rerun replaces the artefact, as it replaces the draft's assets.
      - name: Hand the assets to the attest job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Write the notes from the template
        shell: bash
        run: node scripts/release.mjs notes "$TAG" "$RUNNER_TEMP/notes.md"

      # The only step of this repository's own that holds the token. Nothing
      # is written before the script has judged what GitHub already has for
      # the tag, and the draft is read back and compared with the files
      # afterwards.
      - name: Create or update the draft, upload the assets, and check them
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.decide.outputs.name }}
          PRERELEASE: ${{ steps.decide.outputs.prerelease }}
        run: |
          set -euo pipefail
          listing="$RUNNER_TEMP/releases.jsonl"
          list() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | {id, tag_name, draft, prerelease, assets: [.assets[] | {name, size, digest}]}' > "$listing"
          }
          list
          plan=$(node scripts/release.mjs existing "$TAG" "$listing" release-assets)
          action=$(jq -r .action <<< "$plan")
          prerelease_flag=()
          if [ "$PRERELEASE" = true ]; then prerelease_flag=(--prerelease); fi
          case "$action" in
            create)
              echo "drafting $NAME for $TAG"
              gh release create "$TAG" --draft --verify-tag --title "$NAME" \
                --notes-file "$RUNNER_TEMP/notes.md" "${prerelease_flag[@]}"
              ;;
            update)
              # The notes are left alone: the maintainer may have edited them
              # in the draft, and a rerun must not put the template back.
              echo "updating the draft $NAME for $TAG (id $(jq -r .id <<< "$plan")); its notes are kept"
              gh release edit "$TAG" --draft=true --prerelease="$PRERELEASE" --title "$NAME"
              while IFS= read -r stale; do
                if [ -n "$stale" ]; then
                  echo "removing $stale, which this run does not attach"
                  gh release delete-asset "$TAG" "$stale" --yes
                fi
              done < <(jq -r '.stale[]' <<< "$plan")
              ;;
            *)
              echo "::error::release.mjs answered $plan"
              exit 1
              ;;
          esac
          gh release upload "$TAG" release-assets/* --clobber
          list
          node scripts/release.mjs verify "$TAG" "$listing" release-assets
          {
            echo "### Draft: $NAME"
            echo
            echo "Not published. Read it on the repository's Releases page and, once this run's attest and verify jobs are green, publish it by hand."
            echo
            echo '~~~'
            cat release-assets/SHA256SUMS.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  # Signed SLSA build provenance for each installer and for SHA256SUMS.txt,
  # which names every other asset by its hash (issue 434, ADR-057).
  # SHA256SUMS.txt beside the files it lists shows a download arrived whole,
  # not who made it: whoever could replace a file could replace its line too.
  # An attestation is signed through Sigstore for this workflow, this
  # repository and the tag's commit, and kept by GitHub apart from the
  # Release, so `gh attestation verify` shows a download was built here
  # (docs/install.md).
  #
  # A job of its own, because id-token: write is job-wide: here only
  # download-artifact, a shell check and the attest action can mint the OIDC
  # token Sigstore's certificate is issued for, never checkout, setup-node or
  # this repository's scripts, and the job cannot write to the repository.
  # It reads the release-assets artefact the release job uploaded before it
  # wrote the draft, never the draft. The draft is published by hand only
  # after this job is green.
  attest:
    name: attest (provenance)
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # id-token mints the OIDC token Sigstore's short-lived signing certificate
    # is issued for; attestations stores the signed statement with the
    # repository. Nothing else in the workflow has either.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the assets the release job drafted
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      # Every file is the one SHA256SUMS.txt names, byte for byte, and no file
      # is there that it does not name, so what is attested is what the
      # release job checked the draft against.
      - name: Refuse a file whose sha256 is not its line in SHA256SUMS.txt
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS.txt
          listed=$(awk '{ print $2 }' SHA256SUMS.txt | LC_ALL=C sort)
          present=$(ls -1A | { grep -vx 'SHA256SUMS.txt' || true; } | LC_ALL=C sort)
          if [ -z "$listed" ] || [ "$listed" != "$present" ]; then
            echo "::error::the downloaded assets and SHA256SUMS.txt name different files"
            diff <(printf '%s\n' "$listed") <(printf '%s\n' "$present") || true
            exit 1
          fi
          echo "every file is the one SHA256SUMS.txt names: $(wc -l <<< "$present" | tr -d ' ') files"

      - name: Attest the installers and SHA256SUMS.txt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/SHA256SUMS.txt

  # What the attest job signed, checked the way a person would check a
  # download (issue 557, ADR-057): `gh attestation verify` over every
  # subject, asking for this repository, this workflow file, this tag and
  # this commit, and refusing a self-hosted runner. Signing proves nothing
  # until something verifies it, and this is the first thing that does.
  #
  # A job of its own, after attest, so that checking never shares a job with
  # the token that signs: it holds contents: read and attestations: read,
  # which the attestations API needs to answer, and no id-token, so it cannot
  # sign. It reads the same release-assets artefact as attest, never the
  # draft. The draft is published by hand only after this job and attest are
  # both green.
  verify:
    name: verify (attestations)
    needs: attest
    if: ${{ !cancelled() && needs.attest.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download the assets the release job drafted
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      # The subjects are the attest job's own, in the same patterns. A pattern
      # that matches nothing is left as typed, and gh refuses a file that is
      # not there, so a missing installer fails here and is never skipped.
      - name: Verify the attestation of every installer and of SHA256SUMS.txt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for subject in release-assets/*.dmg release-assets/*.exe release-assets/SHA256SUMS.txt; do
            echo "verifying $subject"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
          echo "every installer and SHA256SUMS.txt is attested as built here from $GITHUB_REF at $GITHUB_SHA"
