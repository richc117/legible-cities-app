# The half of the never list that no secret scanner recognises: absolute
# paths from someone's machine, personal addresses, private hostnames, links
# to tool sessions. `gitleaks.yml` covers keys and tokens.
#
# The same script runs locally through .pre-commit-config.yaml. Here it reads
# every commit message in the history it was given, not just the new ones, so
# a leak that arrived through a merge is still a red check.
#
# On a pull request it also reads the commits the branch adds, for what the
# passes above do not cover: a keyword that closes an issue, and a symbolic
# link that one commit added and a later one took out again.
name: preflight

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Personal paths, addresses, keys and session links
        run: bin/preflight

      # The scanner the commit guard calls, which the runner does not carry:
      # gitleaks.yml uses the action, and that leaves no binary behind. Without
      # it bin/test-hooks cannot run its end-to-end rows (a leaked key, an
      # unreadable index, a commit asking for -a), and under CI it fails
      # rather than skips (issue 316).
      #
      # Pinned by version and by checksum. The version is the one `rev` names
      # in .pre-commit-config.yaml and GITLEAKS_VERSION names in gitleaks.yml,
      # and the step refuses to go on if either differs. The checksum is the
      # Linux x64 line of the release's own published checksums file, copied
      # here as a literal and never computed from the download it checks:
      #   https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
      # A bump moves all three files, and the checksum with them, in one change.
      # The archive is checked before anything in it is extracted, and nothing
      # is run until it has been.
      - name: gitleaks, pinned by version and checksum
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          hook=$(grep -A1 'repo: https://github.com/gitleaks/gitleaks' .pre-commit-config.yaml |
                 sed -n 's/^ *rev: v//p') || hook=
          action=$(sed -n 's/^ *GITLEAKS_VERSION: *//p' .github/workflows/gitleaks.yml) || action=
          stale=
          if [ "$hook" != "$GITLEAKS_VERSION" ]; then
            echo "gitleaks is $GITLEAKS_VERSION here and ${hook:-not found} as rev in .pre-commit-config.yaml; move them together." >&2
            stale=1
          fi
          if [ "$action" != "$GITLEAKS_VERSION" ]; then
            echo "gitleaks is $GITLEAKS_VERSION here and ${action:-not found} as GITLEAKS_VERSION in .github/workflows/gitleaks.yml; move them together." >&2
            stale=1
          fi
          [ -z "$stale" ] || exit 1
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          download=$(mktemp -d "$RUNNER_TEMP/gitleaks-download.XXXXXX")
          bindir="$RUNNER_TEMP/gitleaks-bin"
          mkdir "$bindir"
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 30 --max-time 300 \
            --output "$download/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          (cd "$download" && printf '%s  %s\n' "$GITLEAKS_SHA256" "$asset" | sha256sum --check --strict -)
          tar -xzf "$download/$asset" -C "$bindir" gitleaks
          got=$("$bindir/gitleaks" version)
          if [ "$got" != "$GITLEAKS_VERSION" ]; then
            echo "the gitleaks that was installed says $got, not $GITLEAKS_VERSION." >&2
            exit 1
          fi
          echo "$bindir" >> "$GITHUB_PATH"

      # The hooks decide what the assistant may run, so they are tested
      # like anything else that makes a decision. Committed again as of
      # ADR-029; before that they lived outside this repository and this
      # step could not exist. With gitleaks on the path from the step above,
      # this runs the end-to-end rows over the commit guard as well, and its
      # last line says how many passed.
      - name: The assistant's allow and refuse tables
        run: bin/test-hooks

      # The commits this pull request adds, read for three things: the never
      # list in their messages, a keyword that closes an issue, and where
      # every symbolic link they add points.
      #
      # A closing keyword in a *commit* message is a different mistake from
      # a leak. A commit message is for why a change was made, and which
      # issue it settles belongs in the pull request. There is one board now
      # (ADR-030), so a keyword would close the right issue and the check is
      # precautionary. The commit-msg hook refuses it while it can still be
      # edited; this is the same check for a machine without the hooks
      # installed.
      #
      # A link is read here as well as in the index, so that one committed
      # with the hooks bypassed is caught though a later commit took it out.
      #
      # Only the commits this pull request adds. The history already carries
      # five closing keywords, and they cannot now be unmade. The range is
      # the two commit ids the event names, and the checkout above fetches
      # the whole history, so both are there to read; a range that cannot be
      # read fails this step, where it used to pass it.
      - name: Messages and links in the commits this pull request adds
        if: github.event_name == 'pull_request'
        run: >-
          bin/preflight --commit-range
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
