# Build the LOOM binaries from the pinned commit and upload them as
# artefacts. Never on every push: the pins change rarely and the build is
# minutes, so it runs when vendor/pins.json changes or when asked.
#
# Written during the A0-05 spike and first run on 2026-09-07, once the
# repository had runners; see docs/adr/spikes/loom-native.md. LOOM is green
# on all four targets. The python job covers darwin-arm64, darwin-x64 and
# win-x64 with one script and one licence gate (A0-06); Linux has no python
# target because the app ships on macOS and Windows first (ADR-021).
# The ffmpeg jobs build a minimal GPL FFmpeg from pinned sources for four
# targets, the fourth, linux-x64, only for tests, and upload its
# Corresponding Source once (ADR-012, ADR-040).
#
# The configure flags are the spike's finding, not a preference: LOOM's
# optional dependencies (GLPK, COIN-OR, Gurobi, libzip) are never called at
# the settings this project uses, and leaving them out is what makes the
# binaries self-contained. OpenMP joined the list after the first CI run:
# GCC finds it and links libgomp dynamically, Apple clang never does, and
# the Linux octi then needed a library a stock container does not have. Do not "fix" this by adding them back and
# bundling - read the spike first.
name: vendor

on:
  push:
    # Branches named, so a pushed tag does not start this workflow on its
    # own: GitHub ignores path filters on a tag push, and build.yml already
    # runs these jobs for a tag through workflow_call.
    branches: ['**']
    paths: ['vendor/pins.json', '.github/workflows/vendor.yml', 'scripts/vendor-python.sh', 'scripts/vendor-ffmpeg.sh']
  workflow_dispatch:
  # .github/workflows/build.yml runs these jobs in its own run, so the
  # installers are packaged from artefacts built from the pins it checked
  # out and never from another run's (A0-10, ADR-035).
  workflow_call:

permissions:
  contents: read

jobs:
  loom:
    name: loom (${{ matrix.target }})
    # No LOOM artefact without its verified Corresponding Source in the same
    # run, as for ffmpeg (ADR-040, ADR-041).
    needs: loom-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64   }
          - { os: ubuntu-22.04, target: linux-x64    }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the pin
        id: pin
        shell: bash
        run: |
          commit=$(python3 -c "import json;print(json.load(open('vendor/pins.json'))['loom']['commit'])")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Building LOOM at $commit"

      - name: Build tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y cmake g++ libprotobuf-dev protobuf-compiler
          else
            brew install cmake protobuf
          fi

      - name: Clone at the pin
        shell: bash
        run: |
          git clone --recurse-submodules https://github.com/ad-freiburg/loom loom-src
          cd loom-src
          git checkout "${{ steps.pin.outputs.commit }}"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"

      - name: Configure without the optional dependencies
        shell: bash
        working-directory: loom-src
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_GLPK=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_COIN=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Gurobi=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibZip=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON

      - name: Build
        shell: bash
        working-directory: loom-src
        run: cmake --build build -j 4 --target gtfs2graph topo loom octi

      - name: Refuse anything that is not self-contained
        shell: bash
        working-directory: loom-src/build
        run: |
          status=0
          for b in gtfs2graph topo loom octi; do
            echo "--- $b ---"
            if [ "$RUNNER_OS" = "macOS" ]; then
              otool -L "$b" | tail -n +2
              # Only /usr/lib and @rpath may appear. Homebrew must not.
              if otool -L "$b" | tail -n +2 | grep -qE '/opt/homebrew|/usr/local/(opt|Cellar)'; then
                echo "::error::$b links a Homebrew library; it will not run on a clean machine"
                status=1
              fi
            else
              ldd "$b"
              # A library the runner has to supply is not self-contained.
              # The first run's octi linked libgomp and this branch let it
              # through because it only printed. Only the C and C++ runtime
              # and the two compression libraries the pin needs may appear.
              if ldd "$b" | grep -q 'not found'; then
                echo "::error::$b needs a library the runner does not ship"
                status=1
              fi
              if ldd "$b" | grep '=>' | grep -vE 'libc\.so|libm\.so|libstdc\+\+|libgcc_s|libpthread|libdl|libz\.so|libbz2' | grep -q .; then
                echo "::error::$b links a library outside the allowlist"
                status=1
              fi
            fi
          done
          exit $status

      - name: Prove it still runs
        shell: bash
        working-directory: loom-src/build
        run: ./loom --help > /dev/null && ./octi --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: loom-${{ matrix.target }}
          path: |
            loom-src/build/gtfs2graph
            loom-src/build/topo
            loom-src/build/loom
            loom-src/build/octi
          if-no-files-found: error
          retention-days: 30

  # The Python sidecar runtime. ADR-020 chose python-build-standalone over
  # PyInstaller; scripts/vendor-python.sh verifies the pinned checksum and
  # fails rather than continuing if the asset changed. The engine it
  # installs is the pinned one (A1-02 wired the block in), with the
  # dependencies it declares, and the script refuses a runtime whose
  # `schematic.serve --schema` does not start or does not hash to the pinned
  # schema. Every step runs under bash, which on windows-latest is Git Bash;
  # scripts/vendor-python.sh says what that constrains. The engine's tags are
  # public since 2026-09-08, and the refuse-early step below guards that.
  python:
    name: python (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64   }
          - { os: windows-latest, target: win-x64      }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the engine's pin
        id: engine
        shell: bash
        run: |
          # actions/checkout wants owner/repo, not the URL the pin stores
          # for the tools that clone with git. The Windows runner may have
          # `python` and no working `python3`.
          host_py=python3
          "$host_py" -c 'import sys' >/dev/null 2>&1 || host_py=python
          "$host_py" - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.stdout.reconfigure(newline='\n')  # no \r in an output value on Windows
          engine = json.load(open('vendor/pins.json'))['engine']
          owner_repo = engine['repo'].removeprefix('https://github.com/').removesuffix('.git')
          if owner_repo.count('/') != 1:
              raise SystemExit(f"engine.repo is not a GitHub URL: {engine['repo']}")
          print(f"repo={owner_repo}")
          print(f"tag={engine['tag']}")
          print(f"version={engine['version']}")
          PY
      - name: Refuse early if the engine's tag is not published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_REPO: ${{ steps.engine.outputs.repo }}
          PINNED_TAG: ${{ steps.engine.outputs.tag }}
        run: |
          # Without this the checkout below fails with a bare "couldn't find
          # ref", which says nothing about what to do. The engine is tagged
          # in its own repository and pushed by hand; until that happens
          # this job cannot vendor a runtime with the engine in it.
          if ! gh api "repos/$PINNED_REPO/git/ref/tags/$PINNED_TAG" >/dev/null 2>&1; then
            echo "::error::$PINNED_REPO has no tag $PINNED_TAG. The engine's tags are pushed by hand; this job vendors the runtime once that is done."
            exit 1
          fi
          echo "$PINNED_REPO is tagged $PINNED_TAG"
      - name: Check out the engine at its pin
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.engine.outputs.repo }}
          ref: ${{ steps.engine.outputs.tag }}
          path: engine
          persist-credentials: false
      - name: Refuse an engine that is not the pinned version
        shell: bash
        env:
          PINNED_VERSION: ${{ steps.engine.outputs.version }}
          PINNED_TAG: ${{ steps.engine.outputs.tag }}
        run: |
          # The pin names a tag and a version; a tag that has moved would
          # otherwise vendor an engine the app was not built against.
          found=$(grep -oE '__version__ *= *"[^"]+"' engine/src/schematic/__init__.py | head -1 | cut -d'"' -f2)
          if [ "$found" != "$PINNED_VERSION" ]; then
            echo "::error::the pin says $PINNED_VERSION, the tag holds $found"
            exit 1
          fi
          echo "engine $found at $PINNED_TAG"
      - name: Fetch, verify, strip and prove the runtime
        shell: bash
        # A relative engine path, so no backslashed workspace path reaches
        # the script on Windows; the script resolves it before it moves.
        run: bash scripts/vendor-python.sh ${{ matrix.target }} engine
      - name: Refuse a runtime carrying a GPL component we did not intend
        shell: bash
        run: |
          # THIRD_PARTY_NOTICES.md requires no GNU readline and no GDBM. The
          # spike found PyInstaller collecting readline from the build host;
          # this is the check that would have caught it.
          #
          # Every test captures its command's output and then tests the text.
          # `find ... | grep -q .` is wrong under the -eo pipefail GitHub
          # gives bash: grep exits at the first line, a find with more to
          # write dies of SIGPIPE, and the pipeline fails - so the `if` takes
          # the no-match branch exactly when there are many matches.
          #
          # By name, on all three targets. The last two names are the
          # Windows forms: python-build-standalone ships no readline there,
          # so a readline DLL or extension could only come from a package.
          named=$(find vendor/python -iname '*gdbm*' -o -iname 'libreadline*' \
            -o -iname '*readline*.dll' -o -iname '*readline*.pyd')
          if [ -n "$named" ]; then
            echo "::error::the vendored runtime carries GDBM or GNU readline"
            printf '%s\n' "$named"
            exit 1
          fi
          echo "no GDBM or GNU readline by name"
          # By link, on macOS: a name says nothing about what a binary loads.
          # Every Mach-O in the tree is read, wheels' included, and any
          # library whose path names readline or gdbm fails the build; so
          # does finding no Mach-O at all, which would mean the find is wrong
          # and nothing was checked.
          #
          # Then what is known to be there is required, not only what must
          # not be: the interpreter's readline module is built into libpython
          # and uses the system's libedit, so libpython must link libedit and
          # must import rl_library_version from libedit rather than define
          # it (nm -m names the library an undefined symbol binds to). A
          # readline compiled into libpython would show in no link list; it
          # would show as that import going missing.
          if [ "$RUNNER_OS" = "macOS" ]; then
            links=$(find vendor/python -type f \( -name '*.so' -o -name '*.dylib' \
              -o \( -path '*/python/bin/python3.[0-9]*' ! -name '*-config' \) \) \
              -exec otool -L {} +)
            files=$(grep -c ':$' <<< "$links" || true)
            if [ "${files:-0}" -eq 0 ]; then
              echo "::error::the link check found no Mach-O file under vendor/python; nothing was checked"
              exit 1
            fi
            linked=$(grep -iE '^[[:space:]].*(readline|gdbm)' <<< "$links" || true)
            if [ -n "$linked" ]; then
              echo "::error::a binary in the vendored runtime links GNU readline or GDBM"
              printf '%s\n' "$linked"
              exit 1
            fi
            echo "no link to readline or gdbm in $files Mach-O files"
            libs=$(find vendor/python -type f -path '*/python/lib/libpython3.*.dylib')
            if [ -z "$libs" ]; then
              echo "::error::no libpython under vendor/python to check readline against"
              exit 1
            fi
            while IFS= read -r lib; do
              lib_links=$(otool -L "$lib")
              if [ -z "$(grep -E '^[[:space:]]+/usr/lib/libedit\.' <<< "$lib_links" || true)" ]; then
                echo "::error::$lib does not link the system's libedit"
                printf '%s\n' "$lib_links"
                exit 1
              fi
              undefined=$(nm -m -gu "$lib")
              if [ -z "$(grep -E '[[:space:]]_rl_library_version \(from libedit\)$' <<< "$undefined" || true)" ]; then
                echo "::error::$lib does not import rl_library_version from libedit; its readline may be another"
                grep -E '_rl_library_version' <<< "$undefined" || true
                exit 1
              fi
              echo "$lib links /usr/lib/libedit and imports rl_library_version from it"
            done <<< "$libs"
          fi
          # The shared libraries it does carry, by name, so a new one shows
          # up in the log of the run that brought it.
          echo "shared libraries:"
          find vendor/python \( -iname '*.dll' -o -iname '*.dylib' \) -exec basename {} \; | sort | uniq -c
      - name: Time the sidecar's cold start
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # For the spike report: three runs of what the script proved,
          # first with no bytecode at all (the runtime as vendored, and
          # nothing written into it), then with a bytecode cache outside the
          # runtime, whose first run compiles and whose last two do not.
          case "$TARGET" in
            win-*) py="vendor/python/$TARGET/python/python.exe" ;;
            *)     py="vendor/python/$TARGET/python/bin/python3" ;;
          esac
          TIMEFORMAT="%R s"
          echo "$TARGET, no bytecode:"
          for i in 1 2 3; do
            time PYTHONDONTWRITEBYTECODE=1 "$py" -m schematic.serve --schema > /dev/null
          done
          echo "$TARGET, bytecode cached outside the runtime:"
          for i in 1 2 3; do
            time PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" "$py" -m schematic.serve --schema > /dev/null
          done
          if [ -n "$(find "vendor/python/$TARGET" -name __pycache__ -print -quit)" ]; then
            echo "::error::timing wrote bytecode into the runtime about to be uploaded"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.target }}
          path: vendor/python/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  # Windows builds under MSYS2 UCRT64 from our own tree at the pin, with the
  # changes Transport for Cairo's port documents applied by
  # scripts/loom-windows-patch.py (ADR-021: build, do not borrow). A separate
  # job rather than a matrix entry so its failure does not read as the others
  # failing, and so the shell difference stays visible.
  loom-windows:
    name: loom (win-x64)
    needs: loom-source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Runner labels: macos-13 was retired and macos-14 is deprecated in
      # GitHub's runner-images table (checked 2026-09-07); macos-15 and
      # macos-15-intel are the current arm64 and x64 images.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-python
      # zlib and bzip2 are linked into the tools statically from MSYS2's
      # packages, which move with MSYS2 (update: true above); their sources
      # travel with LOOM's only for the versions the pins name, so any other
      # fails here, before a minute is spent. The exact package revisions of
      # everything linked in go to the release inside LOOM's source archive.
      - name: Refuse a zlib or bzip2 other than the pinned one, and record what is linked in
        shell: msys2 {0}
        run: |
          set -euo pipefail
          packages=$(pacman -Q)
          status=0
          for lib in zlib bzip2; do
            want=$(python -c "import json,sys;print(json.load(open('vendor/pins.json'))['loom_windows_static'][sys.argv[1]]['version'])" "$lib")
            want=${want//$'\r'/}
            line=$(grep -E "^mingw-w64-ucrt-x86_64-$lib " <<< "$packages" || true)
            have=${line#* }
            have=${have%-*}
            echo "$lib: MSYS2 has ${line:-nothing}; the pin is $want"
            if [ -z "$line" ] || [ "$have" != "$want" ]; then
              echo "::error::MSYS2's $lib is ${have:-missing}, not the pinned $want; move loom_windows_static.$lib in vendor/pins.json, with its tarball's sha256 and signature, to build"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          record=$(grep -E '^mingw-w64-ucrt-x86_64-(gcc|gcc-libs|binutils|crt|crt-git|headers|headers-git|winpthreads|winpthreads-git|libwinpthread|libwinpthread-git|zlib|bzip2) ' <<< "$packages")
          mkdir -p loom-windows-toolchain
          {
            echo "The MSYS2 UCRT64 packages the Windows LOOM tools were built with, from"
            echo "the loom-windows job of .github/workflows/vendor.yml, run $GITHUB_RUN_ID of"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY at commit $GITHUB_SHA."
            echo
            echo "Linked in statically: zlib and bzip2 (their release tarballs are in"
            echo "windows-static/), GCC's libgcc and libstdc++ (gcc-libs), and mingw-w64's CRT"
            echo "and winpthreads. MSYS2's recipe for each revision is its PKGBUILD in"
            echo "https://github.com/msys2/MINGW-packages."
            echo
            printf '%s\n' "$record"
          } > loom-windows-toolchain/TOOLCHAIN-win-x64.txt
          cat loom-windows-toolchain/TOOLCHAIN-win-x64.txt
      - name: Clone LOOM at the pin and the port at its pin
        shell: msys2 {0}
        run: |
          set -euo pipefail
          commit=$(python -c "import json;print(json.load(open('vendor/pins.json'))['loom']['commit'])")
          port=$(python -c "import json;print(json.load(open('vendor/pins.json'))['loom_windows_port']['commit'])")
          git clone --recurse-submodules https://github.com/ad-freiburg/loom loom-src
          git -C loom-src checkout "$commit"
          git -C loom-src submodule update --init --recursive
          test "$(git -C loom-src rev-parse HEAD)" = "$commit"
          git clone https://github.com/transportforcairo/loom-windows-port port
          git -C port checkout "$port"
          test "$(git -C port rev-parse HEAD)" = "$port"
      - name: Apply the port's documented changes to our tree
        shell: msys2 {0}
        run: python scripts/loom-windows-patch.py loom-src port
      - name: Configure and build the four tools
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # -static alone is not enough: CMake resolves zlib and bzip2 to their
          # import libraries by full path, and the first run's topo, loom and
          # octi then loaded zlib1.dll and libbz2-1.dll from the MSYS2 tree.
          # Hand it the static archives instead.
          test -f /ucrt64/lib/libz.a && test -f /ucrt64/lib/libbz2.a
          bz2=$(cygpath -m /ucrt64/lib/libbz2.a)
          cmake -S loom-src -B loom-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_GLPK=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_COIN=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Gurobi=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibZip=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DBZIP2_LIBRARY_RELEASE="$bz2" \
            -DBZIP2_LIBRARY_DEBUG="$bz2"
          cmake --build loom-src/build -j 4 --target gtfs2graph topo loom octi
      - name: Refuse anything that is not self-contained
        shell: msys2 {0}
        working-directory: loom-src/build
        run: |
          status=0
          for b in gtfs2graph topo loom octi; do
            echo "--- $b.exe ---"
            ldd "$b.exe"
            # Only Windows' own DLLs may appear. Anything from the MSYS2 tree
            # would be a DLL we would have to ship; anything missing is worse.
            if ldd "$b.exe" | grep -iE '/ucrt64/|/mingw|/usr/|not found'; then
              echo "::error::$b.exe needs a DLL that is not Windows' own"
              status=1
            fi
          done
          exit $status
      - name: Prove it still runs
        shell: msys2 {0}
        working-directory: loom-src/build
        run: ./loom.exe --help > /dev/null && ./octi.exe --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: loom-win-x64
          path: |
            loom-src/build/gtfs2graph.exe
            loom-src/build/topo.exe
            loom-src/build/loom.exe
            loom-src/build/octi.exe
          if-no-files-found: error
          retention-days: 30
      # build.yml's release job puts this beside LOOM's source in the Release.
      - uses: actions/upload-artifact@v7
        with:
          name: loom-windows-toolchain
          path: loom-windows-toolchain
          if-no-files-found: error
          retention-days: 30

  # FFmpeg and ffprobe, built here from the pinned sources (ADR-040, which
  # amends ADR-012): FFmpeg's release tarball and x264 at a commit, each
  # checked by sha256, configured with --disable-everything and only what the
  # engine's export.py uses enabled back, with x264 the one external library
  # (zlib, which the PNG codecs need, is the system's on macOS and Linux and
  # built from its release tarball on Windows). scripts/vendor-ffmpeg.sh
  # builds, refuses a configure line that is not the pinned one, then proves
  # the pair as it proved the third-party builds before: the version and
  # configure line, --enable-gpl, --enable-version3 and --enable-libx264 and no
  # --enable-nonfree, -L, every component export.py names, and a one-second
  # MP4 and GIF encoded the way the engine does and read back with ffprobe.
  # Nothing reaches vendor/ffmpeg/<target> before that. The steps below then
  # refuse any library the system does not provide and any configure flag
  # beyond the pinned kinds. linux-x64 is for tests and is not shipped, so it
  # is proven here and not uploaded: an artefact of this public repository is
  # a conveyed GPL binary. A5-04 runs the script directly.
  ffmpeg:
    name: ffmpeg (${{ matrix.target }})
    # No ffmpeg artefact without its verified Corresponding Source in the
    # same run: A6-01 attaches ffmpeg-source to the release beside them.
    needs: ffmpeg-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64   }
          - { os: ubuntu-22.04,   target: linux-x64    }
    env:
      TARGET: ${{ matrix.target }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build tools
        shell: bash
        run: |
          # Build tools only; nothing installed here is linked into the
          # result, which the link check below proves. nasm assembles x264's
          # and FFmpeg's x86-64 code; Apple silicon needs none. pkgconf, not
          # pkg-config: the runner already has pkgconf, and apt removes it,
          # with packages that depend on it, to install pkg-config instead.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y nasm pkgconf zlib1g-dev
          else
            command -v pkg-config >/dev/null || brew install pkgconf
            if [ "$TARGET" = darwin-x64 ]; then brew install nasm; fi
          fi
      - name: Build, verify and prove ffmpeg and ffprobe
        shell: bash
        run: time bash scripts/vendor-ffmpeg.sh "$TARGET"
      - name: Refuse a binary that links anything outside the system, or is another architecture or macOS
        shell: bash
        run: |
          # Output is captured and tested as text, as in the python job, and
          # a check that read fewer than the two binaries fails.
          dir="vendor/ffmpeg/$TARGET"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Only /usr/lib and /System may appear: a Homebrew or /usr/local
            # dylib would load on the runner and on no user's machine.
            links=$(find "$dir" -type f -exec otool -L {} +)
            printf '%s\n' "$links"
            files=$(grep -c ':$' <<< "$links" || true)
            if [ "${files:-0}" -ne 2 ]; then
              echo "::error::the link check read ${files:-0} Mach-O files under $dir, not ffmpeg and ffprobe"
              exit 1
            fi
            outside=$(grep -E '^[[:space:]]' <<< "$links" | grep -vE '^[[:space:]]+/(usr/lib|System/Library)/' || true)
            if [ -n "$outside" ]; then
              echo "::error::ffmpeg or ffprobe links a library outside /usr/lib and /System"
              printf '%s\n' "$outside"
              exit 1
            fi
            echo "ffmpeg and ffprobe link only /usr/lib and /System"
            # Each binary is exactly the target's architecture: a universal
            # binary would double the size, and the other architecture would
            # run on this runner under Rosetta and prove nothing about a user's.
            case "$TARGET" in
              darwin-arm64) want=arm64 ;;
              darwin-x64)   want=x86_64 ;;
              *) echo "::error::no architecture known for $TARGET"; exit 1 ;;
            esac
            for b in ffmpeg ffprobe; do
              archs=$(lipo -archs "$dir/$b")
              if [ "$archs" != "$want" ]; then
                echo "::error::$b is '$archs', not $want"
                exit 1
              fi
              # No newer than the macOS the pinned Electron needs (13.0), or
              # the export fails on a Mac the app itself starts on.
              load=$(otool -l "$dir/$b")
              minos=$(awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }' <<< "$load")
              echo "$b: $archs, minos $minos"
              if [ "$minos" != "13.0" ]; then
                echo "::error::$b is built for macOS ${minos:-unknown}, not 13.0"
                exit 1
              fi
            done
            echo "ffmpeg and ffprobe are $want only, for macOS 13.0 and later"
          else
            # The C library, libm, libpthread, libdl and zlib are the system's
            # on every Linux; anything else would be one a machine has to
            # supply, and x264 must not appear as a library at all.
            status=0
            for b in ffmpeg ffprobe; do
              echo "--- $b ---"
              links=$(ldd "$dir/$b")
              printf '%s\n' "$links"
              if [ -z "$(grep -E 'libc\.so' <<< "$links" || true)" ]; then
                echo "::error::ldd listed no C library for $b; nothing was checked"
                status=1
              fi
              if [ -n "$(grep 'not found' <<< "$links" || true)" ]; then
                echo "::error::$b needs a library the runner does not ship"
                status=1
              fi
              outside=$(grep -vE '^[[:space:]]*(linux-vdso\.so|/lib64/ld-linux-x86-64\.so|(libc|libm|libpthread|libdl|libz)\.so)' <<< "$links" || true)
              if [ -n "$outside" ]; then
                echo "::error::$b links a library outside the allowlist"
                printf '%s\n' "$outside"
                status=1
              fi
            done
            exit $status
          fi
      - name: Refuse a configure line with a library but x264 and zlib, nonfree, or not everything else disabled
        shell: bash
        run: |
          # Every --enable- flag must be one of the licence switches, zlib,
          # libx264, or a list of FFmpeg's own components; anything else
          # (another external library, --enable-nonfree, a hardware API)
          # fails, whatever the pin says.
          status=0
          for b in ffmpeg ffprobe; do
            conf=$("vendor/ffmpeg/$TARGET/$b" -hide_banner -buildconf)
            conf=${conf//$'\r'/}
            enabled=$(grep -oE -- '--enable-[a-z0-9_-]+' <<< "$conf" | sort -u)
            echo "$b enables: $(tr '\n' ' ' <<< "$enabled")"
            if [ -z "$enabled" ]; then
              echo "::error::$b -buildconf listed nothing; nothing was checked"
              status=1
            fi
            others=$(grep -vxE -- '--enable-(gpl|version3|zlib|libx264|encoder|decoder|parser|muxer|demuxer|filter|indev|protocol)' <<< "$enabled" || true)
            if [ -n "$others" ]; then
              echo "::error::$b is configured with $(tr '\n' ' ' <<< "$others")"
              status=1
            fi
            # And everything else off: without these two, every component
            # and every library FFmpeg can find on the runner comes back, and
            # on macOS VideoToolbox and its kin live under /System, where the
            # link check allows them.
            for flag in --disable-everything --disable-autodetect; do
              if [ -z "$(grep -xF -- "$flag" <<< "$(grep -oE -- '--disable-[a-z0-9_-]+' <<< "$conf")" || true)" ]; then
                echo "::error::$b is not configured with $flag"
                status=1
              fi
            done
          done
          exit $status
      - name: Measure
        shell: bash
        run: |
          # What the pair adds to an installer, unpacked, for ADR-040.
          bytes=$(cat "vendor/ffmpeg/$TARGET/ffmpeg" "vendor/ffmpeg/$TARGET/ffprobe" | wc -c | tr -d ' ')
          ls -l "vendor/ffmpeg/$TARGET"
          line="$TARGET: ffmpeg and ffprobe $bytes bytes, $(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }') MB"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: matrix.target != 'linux-x64'
        with:
          name: ffmpeg-${{ matrix.target }}
          path: vendor/ffmpeg/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  # Windows builds under MSYS2 UCRT64 on windows-latest, beside the LOOM
  # Windows job and for the same reasons (ADR-021, ADR-040): the build and
  # the proof run on the operating system that ships, in one job. The build
  # step is MSYS2's shell; the proof is Git Bash's, where it has always run,
  # and it takes the pair the build left. GCC's runtime, zlib and x264 are
  # all linked statically, and the import table must name only Windows' own
  # DLLs.
  ffmpeg-windows:
    name: ffmpeg (win-x64)
    needs: ffmpeg-source
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TARGET: win-x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            git
            curl
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
      - name: Build ffmpeg and ffprobe
        shell: msys2 {0}
        run: time bash scripts/vendor-ffmpeg.sh --build-only "$TARGET" vendor/ffmpeg/.built-win-x64
      - name: Verify and prove them
        shell: bash
        run: bash scripts/vendor-ffmpeg.sh --from vendor/ffmpeg/.built-win-x64 "$TARGET"
      - name: Refuse a DLL that is not Windows' own, or a zlib that is not the pinned one
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # The direct imports, from the PE import table: a DLL from the MSYS2
          # tree (libwinpthread, libgcc, zlib1, libx264) would be one we had
          # to ship. The C runtime is the Universal CRT, reached through its
          # api-ms-win-crt API sets, part of Windows 10 and later.
          status=0
          zlib=$(python -c "import json;print(json.load(open('vendor/pins.json'))['ffmpeg']['zlib']['version'])")
          zlib=${zlib//$'\r'/}
          for b in ffmpeg ffprobe; do
            exe="vendor/ffmpeg/$TARGET/$b.exe"
            imports=$(objdump -p "$exe" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr -d '\r')
            echo "--- $b.exe imports ---"
            printf '%s\n' "$imports"
            if [ -z "$imports" ]; then
              echo "::error::objdump listed no imports for $b.exe; nothing was checked"
              status=1
            fi
            outside=$(grep -viE '^(kernel32|user32|advapi32|bcrypt|ole32|oleaut32|shell32|shlwapi|psapi|gdi32|ws2_32|msvcrt|ucrtbase|ntdll)\.dll$|^api-ms-win-(crt|core)-[a-z0-9-]+\.dll$' <<< "$imports" || true)
            if [ -n "$outside" ]; then
              echo "::error::$b.exe imports a DLL that is not Windows' own: $(tr '\n' ' ' <<< "$outside")"
              status=1
            fi
            # zlib is linked statically, so no import shows which; its own
            # copyright string does, and it must be the pinned release rather
            # than a static zlib from the MSYS2 tree.
            if ! grep -aqF " deflate $zlib Copyright" "$exe"; then
              echo "::error::$b.exe does not carry zlib $zlib"
              status=1
            fi
          done
          exit $status
      - name: Refuse a configure line with a library but x264 and zlib, nonfree, or not everything else disabled
        shell: bash
        run: |
          status=0
          for b in ffmpeg ffprobe; do
            conf=$("vendor/ffmpeg/$TARGET/$b.exe" -hide_banner -buildconf)
            conf=${conf//$'\r'/}
            enabled=$(grep -oE -- '--enable-[a-z0-9_-]+' <<< "$conf" | sort -u)
            echo "$b enables: $(tr '\n' ' ' <<< "$enabled")"
            if [ -z "$enabled" ]; then
              echo "::error::$b -buildconf listed nothing; nothing was checked"
              status=1
            fi
            others=$(grep -vxE -- '--enable-(gpl|version3|zlib|libx264|encoder|decoder|parser|muxer|demuxer|filter|indev|protocol)' <<< "$enabled" || true)
            if [ -n "$others" ]; then
              echo "::error::$b is configured with $(tr '\n' ' ' <<< "$others")"
              status=1
            fi
            # And everything else off: without these two, every component
            # and every library FFmpeg can find on the runner comes back, and
            # on macOS VideoToolbox and its kin live under /System, where the
            # link check allows them.
            for flag in --disable-everything --disable-autodetect; do
              if [ -z "$(grep -xF -- "$flag" <<< "$(grep -oE -- '--disable-[a-z0-9_-]+' <<< "$conf")" || true)" ]; then
                echo "::error::$b is not configured with $flag"
                status=1
              fi
            done
          done
          exit $status
      - name: Measure
        shell: bash
        run: |
          bytes=$(cat "vendor/ffmpeg/$TARGET/ffmpeg.exe" "vendor/ffmpeg/$TARGET/ffprobe.exe" | wc -c | tr -d ' ')
          ls -l "vendor/ffmpeg/$TARGET"
          line="$TARGET: ffmpeg and ffprobe $bytes bytes, $(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }') MB"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-win-x64
          path: vendor/ffmpeg/win-x64
          if-no-files-found: error
          retention-days: 30

  # The Corresponding Source of every ffmpeg above, uploaded once and first:
  # FFmpeg's release tarball, x264 at its commit and zlib's release tarball,
  # as fetched and verified against the pins, FFmpeg's and zlib's with their
  # signatures checked by gpg against the pinned key fingerprints, with
  # copies of the script, the pins and this workflow, and BUILD.txt naming
  # every configure line and this run's commit. The ffmpeg jobs need this
  # one, so no binary is built or uploaded in a run whose sources did not
  # verify. A6-01 attaches this artefact, by this name, to each GitHub
  # Release (ADR-040).
  ffmpeg-source:
    name: ffmpeg (source)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch and verify the sources
        shell: bash
        run: bash scripts/vendor-ffmpeg.sh --sources ffmpeg-source
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-source
          path: ffmpeg-source
          if-no-files-found: error
          retention-days: 30

  # The Corresponding Source of the LOOM binaries above (A6-01, ADR-041):
  # LOOM at the pinned commit with its submodules at the commits that commit
  # records, the Windows port at its pinned commit, the patch script that
  # applies the port's changes, the release tarballs of zlib and bzip2, which
  # the Windows tools link statically, and copies of the pins and this
  # workflow, whose loom and loom-windows jobs are the build instructions.
  # Each clone is checked against the commit the pins record, every
  # submodule against the commit LOOM's tree records for it, and each
  # tarball against its sha256 and signature, before anything is archived.
  # The LOOM jobs need this one, so no LOOM artefact is uploaded in a run
  # whose sources did not verify, as for ffmpeg. The release job in build.yml
  # attaches this artefact, by this name, to each GitHub Release, with the
  # loom-windows job's record of the MSYS2 packages inside it.
  loom-source:
    name: loom (source)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch LOOM and the Windows port at their pins, and archive them
        shell: bash
        run: |
          set -euo pipefail
          read_pin() { python3 -c "import json,sys;print(json.load(open('vendor/pins.json'))[sys.argv[1]][sys.argv[2]])" "$1" "$2"; }
          loom_repo=$(read_pin loom repo)
          loom_commit=$(read_pin loom commit)
          port_repo=$(read_pin loom_windows_port repo)
          port_commit=$(read_pin loom_windows_port commit)
          work="$RUNNER_TEMP/loom-source"
          out=loom-source
          mkdir -p "$work" "$out/build"

          git clone --quiet --recurse-submodules "$loom_repo" "$work/loom"
          git -C "$work/loom" checkout --quiet "$loom_commit"
          git -C "$work/loom" submodule update --quiet --init --recursive
          test "$(git -C "$work/loom" rev-parse HEAD)" = "$loom_commit"
          # A leading '-' is a submodule not checked out, '+' one at another
          # commit than LOOM's tree records, 'U' a conflict: any of them and
          # the archive would not be the source the binaries were built from.
          submodules=$(git -C "$work/loom" submodule status --recursive)
          printf '%s\n' "$submodules"
          if [ -z "$submodules" ] || grep -qE '^[-+U]' <<< "$submodules"; then
            echo "::error::LOOM's submodules are not all checked out at the commits $loom_commit records"
            exit 1
          fi
          if [ -n "$(git -C "$work/loom" status --porcelain --ignore-submodules=none)" ]; then
            echo "::error::the LOOM checkout is not clean"
            exit 1
          fi

          git clone --quiet "$port_repo" "$work/port"
          git -C "$work/port" checkout --quiet "$port_commit"
          test "$(git -C "$work/port" rev-parse HEAD)" = "$port_commit"

          # The release tarballs of the libraries the Windows tools link
          # statically from MSYS2 (loom_windows_static in the pins), each
          # checked against its sha256 and its signature verified by gpg
          # against the key with the pinned primary fingerprint, as
          # ffmpeg-source verifies FFmpeg's and zlib's. The loom-windows job
          # refuses a package of any other version. A key's user ID carries
          # its owner's address, so only fingerprints are printed.
          static_pin() { python3 -c "import json,sys,functools;print(functools.reduce(lambda n,k:n[k],sys.argv[2].split('.'),json.load(open('vendor/pins.json'))['loom_windows_static'][sys.argv[1]]))" "$1" "$2"; }
          mkdir -p "$out/windows-static"
          static_lines=
          for lib in zlib bzip2; do
            version=$(static_pin "$lib" version)
            url=$(static_pin "$lib" url)
            sha=$(static_pin "$lib" sha256)
            sig_url=$(static_pin "$lib" signature)
            key_url=$(static_pin "$lib" signing_key.url)
            want=$(static_pin "$lib" signing_key.fingerprint)
            package=$(static_pin "$lib" msys2_package)
            file="$out/windows-static/${url##*/}"
            signature="$file.${sig_url##*.}"
            curl -fsSL --retry 3 --connect-timeout 30 --max-time 300 -o "$file" "$url"
            got=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$got" != "$sha" ]; then
              echo "::error::${file##*/} is sha256 $got, and the pin says $sha"
              exit 1
            fi
            curl -fsSL --retry 3 --connect-timeout 30 --max-time 120 -o "$signature" "$sig_url"
            home=$(mktemp -d)
            chmod 700 "$home"
            curl -fsSL --retry 3 --connect-timeout 30 --max-time 120 -o "$home/key.asc" "$key_url"
            if ! gpg --homedir "$home" --batch --import "$home/key.asc" > /dev/null 2>&1; then
              echo "::error::the signing key for $lib did not import"
              exit 1
            fi
            status=$(gpg --homedir "$home" --batch --status-fd 1 --verify "$signature" "$file" 2> /dev/null || true)
            said=$(awk '$2 ~ /^(VALIDSIG|ERRSIG|NO_PUBKEY|KEYREVOKED|KEYEXPIRED)$/ { print; next }
                        $2 ~ /^(BADSIG|REVKEYSIG|EXPKEYSIG|EXPSIG|GOODSIG)$/ { print $1, $2, $3 }' <<< "$status")
            # A revoked key's signature verifies with gpg exiting 0; it is
            # refused. VALIDSIG's last field is the primary key, whichever
            # subkey signed.
            revoked=$(awk '$2 == "REVKEYSIG" || $2 == "KEYREVOKED"' <<< "$status")
            primary=$(awk '$2 == "VALIDSIG" { print $NF }' <<< "$status")
            if [ -z "$(awk '$2 == "GOODSIG"' <<< "$status")" ] || [ -n "$revoked" ] || [ "$primary" != "$want" ]; then
              printf '%s\n' "$said"
              echo "::error::${file##*/} has no good signature by $want"
              exit 1
            fi
            rm -rf "$home"
            echo "checksum and signature ok: ${file##*/} by $want"
            static_lines+=$(printf '%s\n' \
              "windows-static/${file##*/}  sha256 $sha" \
              "  $lib $version, from $url," \
              "  with a good signature, ${signature##*/}, by the key $want;" \
              "  linked into the Windows tools from MSYS2's $package at that version.")$'\n'
          done

          # archive <folder> <name>: the tree as checked out, submodules
          # included and git's metadata left out, unpacking into <name>/, with
          # names sorted and owners and times fixed, so the same pins make the
          # same tar. The listing is captured before it is cut: a tar piped
          # into head dies of SIGPIPE under pipefail.
          archive() {
            local folder=$1 name=$2 when listing
            when=$(git -C "$work/$folder" log -1 --format=%ct)
            mv "$work/$folder" "$work/$name"
            tar --create --file "$out/$name.tar.gz" --gzip --exclude=.git \
              --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$when" \
              -C "$work" "$name"
            listing=$(tar --list --gzip --file "$out/$name.tar.gz")
            echo "$name.tar.gz: $(wc -l <<< "$listing" | tr -d ' ') entries"
            if grep -qE '(^|/)\.git(/|$)' <<< "$listing"; then
              echo "::error::$name.tar.gz carries git metadata"
              exit 1
            fi
          }
          archive loom "loom-$loom_commit"
          archive port "loom-windows-port-$port_commit"
          cp scripts/loom-windows-patch.py .github/workflows/vendor.yml "$out/build/"
          cp vendor/pins.json "$out/build/pins.json"

          commit=${GITHUB_SHA:-unknown}
          {
            echo "The Corresponding Source of the LOOM binaries Legible Cities ships:"
            echo "gtfs2graph, topo, loom and octi."
            echo
            echo "Written by the loom-source job of .github/workflows/vendor.yml, of"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY at commit $commit."
            echo "Copies of that workflow, of vendor/pins.json and of"
            echo "scripts/loom-windows-patch.py as they were then are in build/."
            echo
            echo "loom-$loom_commit.tar.gz"
            echo "  LOOM at commit $loom_commit of $loom_repo,"
            echo "  with its submodules at the commits that commit records:"
            sed 's/^/    /' <<< "$submodules"
            echo "loom-windows-port-$port_commit.tar.gz"
            echo "  Transport for Cairo's Windows port at commit $port_commit of $port_repo."
            echo "  The Windows build copies win_compat.h and five cppgtfs files from it and"
            echo "  applies its other documented changes to LOOM's tree with"
            echo "  build/loom-windows-patch.py <loom> <port>."
            printf '%s' "$static_lines"
            echo
            echo "TOOLCHAIN-win-x64.txt, which the release adds beside this file from the"
            echo "loom-windows job of the same run, names the exact MSYS2 package revisions"
            echo "of zlib, bzip2, GCC's runtime and mingw-w64's CRT and winpthreads linked in."
            echo
            echo "How each target is built is the loom job (macOS and Linux) and the"
            echo "loom-windows job (Windows, in MSYS2 UCRT64) of build/vendor.yml: CMake in"
            echo "Release mode with GLPK, COIN-OR, Gurobi, libzip and OpenMP left out, and on"
            echo "Windows zlib and bzip2 linked statically, building the targets gtfs2graph,"
            echo "topo, loom and octi. The toolchains are the runners' own."
          } > "$out/BUILD.txt"
          ls -l "$out" "$out/build"
      - uses: actions/upload-artifact@v7
        with:
          name: loom-source
          path: loom-source
          if-no-files-found: error
          retention-days: 30

  # The engine's source at the pinned tag, as the python job installs it into
  # the runtime the installers carry (A6-01, ADR-041). The pins record the
  # engine's tag and version, not a commit, so the tag's version is checked
  # as the python job checks it, and the commit it resolved to is written
  # into BUILD.txt. The release job in build.yml attaches this artefact, by
  # this name, to each GitHub Release.
  engine-source:
    name: engine (source)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the engine at its pinned tag, and archive it
        shell: bash
        run: |
          set -euo pipefail
          read_pin() { python3 -c "import json,sys;print(json.load(open('vendor/pins.json'))['engine'][sys.argv[1]])" "$1"; }
          repo=$(read_pin repo)
          tag=$(read_pin tag)
          version=$(read_pin version)
          work="$RUNNER_TEMP/engine-source"
          out=engine-source
          mkdir -p "$work" "$out/build"

          git clone --quiet --depth 1 --branch "$tag" -c advice.detachedHead=false "$repo" "$work/engine"
          found=$(grep -oE '__version__ *= *"[^"]+"' "$work/engine/src/schematic/__init__.py" | head -1 | cut -d'"' -f2)
          if [ "$found" != "$version" ]; then
            echo "::error::the pin says $version, the tag $tag holds $found"
            exit 1
          fi
          # The archive holds the tree as checked out, so a submodule would be
          # missing from it; the engine has none, and must not gain one unseen.
          if [ -f "$work/engine/.gitmodules" ]; then
            echo "::error::the engine at $tag has submodules, which this archive would leave out"
            exit 1
          fi
          commit=$(git -C "$work/engine" rev-parse HEAD)
          when=$(git -C "$work/engine" log -1 --format=%ct)
          name="legible-cities-$tag"
          mv "$work/engine" "$work/$name"
          # As loom-source archives: sorted, owners and times fixed, no git
          # metadata, the listing captured rather than piped into head.
          tar --create --file "$out/$name.tar.gz" --gzip --exclude=.git \
            --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$when" \
            -C "$work" "$name"
          listing=$(tar --list --gzip --file "$out/$name.tar.gz")
          echo "$name.tar.gz: $(wc -l <<< "$listing" | tr -d ' ') entries"
          if grep -qE '(^|/)\.git(/|$)' <<< "$listing"; then
            echo "::error::$name.tar.gz carries git metadata"
            exit 1
          fi
          if ! grep -qx "$name/src/schematic/__init__.py" <<< "$listing"; then
            echo "::error::$name.tar.gz does not hold the engine's package"
            exit 1
          fi
          cp scripts/vendor-python.sh .github/workflows/vendor.yml "$out/build/"
          cp vendor/pins.json "$out/build/pins.json"
          {
            echo "The source of the legible-cities engine Legible Cities ships, installed"
            echo "into its bundled Python runtime."
            echo
            echo "Written by the engine-source job of .github/workflows/vendor.yml, of"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY at commit ${GITHUB_SHA:-unknown}."
            echo "Copies of that workflow, of vendor/pins.json and of"
            echo "scripts/vendor-python.sh as they were then are in build/."
            echo
            echo "$name.tar.gz"
            echo "  The engine $version at tag $tag of $repo, commit $commit."
            echo
            echo "The python job of build/vendor.yml checks out the same tag and"
            echo "build/vendor-python.sh installs it, with the dependencies it declares,"
            echo "into python-build-standalone's runtime."
          } > "$out/BUILD.txt"
          ls -l "$out" "$out/build"
      - uses: actions/upload-artifact@v7
        with:
          name: engine-source
          path: engine-source
          if-no-files-found: error
          retention-days: 30
