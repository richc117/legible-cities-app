name: Bug report
description: Something the app does wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Before pasting diagnostics or logs, remove anything personal:
        your user name in file paths, addresses, feed URLs you would rather not share.
  - type: input
    id: version
    attributes:
      label: App version and operating system
      description: The App row under Settings › Versions if the app opens; if it does not, the version you downloaded.
      placeholder: "The App row under Settings › Versions, and your system"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it go wrong?
      options:
        - Installing or first opening
        - Opening a sample city or a feed
        - Laying out
        - The map, style or lines
        - Exporting
        - Settings or reset
        - Something else
  - type: input
    id: earlier
    attributes:
      label: Did this work in an earlier version? Which?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Add the Boston preset  2. Schematise  3. Export › Instagram reel"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings › Copy diagnostics, pasted here. Check it for personal paths first.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Log files (optional)
      description: If the app cannot open, or the diagnostics were trimmed, drag main.log and engine.log here.
  - type: input
    id: feed
    attributes:
      label: Feed
      description: Which network or feed URL, if the bug depends on the data and you are happy to share it.
  - type: checkboxes
    id: read
    attributes:
      label: Before you send
      options:
        - label: I read what I pasted or attached and removed anything I would rather not share.
          required: true
