# Dependency updates. Alerts come from the repository's security settings;
# this file is the other half - pull requests that actually do the upgrade.
#
# There is no pip entry. The shipped runtime's packages are the engine's
# `uv.lock` at the pinned tag, exported into vendor/python-requirements.txt
# by scripts/lock-python.sh and held by its hash in vendor/pins.json
# (ADR-057), so a bump of that file alone fails the unit tests and
# check-vendored and can never land. The engine's own .github/dependabot.yml
# proposes them, where a package can move; it reaches here as a pin (issue
# 472). Security updates come from the repository's settings, not from this
# file, so an advisory can still open one against that file: close it, and
# relock the engine.
#
# The labels below must exist on the repository or Dependabot cannot apply
# them; see docs/repository-settings.md.
version: 2

updates:
  # The actions in .github/workflows/, pinned by commit SHA with the version in
  # a trailing comment, and updated here (Dependabot rewrites both).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "ci"

  # The app: Electron, React and their build tooling (from A0-09).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # React and its types move together or not at all: react-dom refuses
      # another react, and @types/react-dom another @types/react, so a pull
      # request for either alone fails at npm ci or in the unit tests.
      # Listed first, because a dependency joins the first group it matches
      # and the two type packages are development dependencies.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # One pull request for the build and test tooling; production
      # dependencies stay separate so each is read on its own.
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
        # Electron arrives alone. Every bump must move the whole
        # electron_ffmpeg block in vendor/pins.json by hand (ADR-043), which
        # Dependabot cannot write, so a group that carries Electron fails
        # its unit tests and cannot be packaged, and takes the rest of the
        # group down with it.
        exclude-patterns: ["electron"]
    # Majors that cannot install until upstream moves, so a pull request for
    # them fails at npm ci on every job. Lift each when its blocker clears.
    ignore:
      # electron-vite 5.0.0 accepts vite up to 7; only its 6.0.0 betas take
      # 8 (alex8088/electron-vite#894). plugin-react 6 needs vite 8.
      - dependency-name: "vite"
        versions: [">=8"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6"]
      # @rogieking/figui3 accepts typescript ^5.0.0 and nothing later, so
      # 6 fails at npm ci. (TypeScript 7.0 also ships no compiler API, and
      # typescript-eslint accepts <6.1.0.)
      - dependency-name: "typescript"
        versions: [">=6"]
