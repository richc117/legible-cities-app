# Dependency updates. Alerts come from the repository's security settings;
# this file is the other half - pull requests that actually do the upgrade.
#
# The npm and pip entries are here before the manifests they watch. Until
# `package.json` lands with the Electron skeleton and the sidecar brings its
# Python requirements, Dependabot reports "no manifest found" for those two
# ecosystems in its job log and opens nothing. That is quieter than
# remembering to add them later.
#
# The labels below must exist on the repository or Dependabot cannot apply
# them; see docs/repository-settings.md.
version: 2

updates:
  # The actions in .github/workflows/, pinned by tag and updated here.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "ci"

  # The app: Electron, React and their build tooling (from A0-09).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # One pull request for the build and test tooling; production
      # dependencies stay separate so each is read on its own.
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    # Majors that cannot install until upstream moves, so a pull request for
    # them fails at npm ci on every job. Lift each when its blocker clears.
    ignore:
      # electron-vite 5.0.0 accepts vite up to 7; only its 6.0.0 betas take
      # 8 (alex8088/electron-vite#894). plugin-react 6 needs vite 8.
      - dependency-name: "vite"
        versions: [">=8"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6"]
      # TypeScript 7.0 ships no compiler API: typescript-eslint accepts
      # <6.1.0 and @rogieking/figui3 accepts ^5.0.0.
      - dependency-name: "typescript"
        versions: [">=7"]

  # The Python sidecar's own requirements, once it has any.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:sidecar"]
    commit-message:
      prefix: "deps"
