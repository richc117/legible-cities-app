# Packaging configuration. `npm run dist` produces an unpacked app locally,
# with or without vendored components; .github/workflows/build.yml produces
# the installers, a dmg per Mac and an nsis installer for Windows, from the
# same run's vendor artefacts (specs/002-vendored-components-and-installers,
# ADR-035).
#
# Every vendored component is copied into the app's resources, outside the
# asar, at a path of the same shape on every target, where the main process
# looks for it (src/main/interpreter.ts, src/main/config.ts):
#
#   resources/python/                the runtime, with the engine installed
#   resources/loom/                  gtfs2graph, topo, loom, octi
#   resources/ffmpeg/                ffmpeg and ffprobe
#   resources/vendor-manifest.json   every component's exact version
#
# electron-builder skips an extraResources source that does not exist, with
# only a warning. The afterPack hook is what refuses it: it checks the
# components where they landed, their architecture, the compiled bytecode,
# and that the manifest was written from this vendor/pins.json. With
# LEGIBLE_VENDOR_TARGET set, as the build workflow sets it, nothing may be
# missing; without it, a build that carries no component at all is let
# through and says it is not an installer.
#
# Unsigned until the release-readiness gate (issue A6-05). On macOS the app
# is signed ad hoc, which needs no identity: the packager changes the bundle
# after Electron's own signature was made, and an Apple-silicon Mac refuses
# a bundle whose signature is broken where it runs one signed ad hoc once a
# person allows it. A Developer ID replaces the `identity` line; nothing
# about the layout changes. `forceCodeSigning` does nothing while the
# identity is `-`: electron-builder 26 builds the ad-hoc identity before the
# only branch that reads the flag. It is kept for when a real identity
# replaces `-`, where a missing certificate then fails the build. What
# checks the ad-hoc signature is build.yml's `codesign --verify` step.
appId: com.richardcaballero.legiblecities
productName: Legible Cities
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
afterPack: ./scripts/check-vendored.mjs
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # The tiny GTFS folder the first-run check runs gtfs2graph over (A6-02,
  # specs/026-first-run-check). Read only; the check's working directory is
  # a temporary folder.
  - from: resources/first-run-gtfs
    to: first-run-gtfs
mac:
  target:
    - dmg
  category: public.app-category.graphics-design
  # The brand icon, drawn on Apple's 824px grid inside the 1024px canvas
  # with its shadow (assets/brand/README.md). electron-builder would derive
  # an .icns from buildResources/icon.png, but that PNG is the full-bleed
  # master: no padding, no shadow, and every size resampled from one image
  # rather than the small master below 128px, which drops the stations.
  icon: assets/brand/macos/icon.icns
  identity: '-'
  forceCodeSigning: true
  extraResources:
    - from: vendor/python/darwin-${arch}/python
      to: python
    - from: vendor/loom/darwin-${arch}
      to: loom
    - from: vendor/ffmpeg/darwin-${arch}
      to: ffmpeg
    - from: vendor/manifest-darwin-${arch}.json
      to: vendor-manifest.json
    # Electron's and Chromium's licences. electron-builder deletes both from
    # a Mac app (app-builder-lib's electronMac.js) and keeps them beside the
    # executable on Windows, as LICENSE.electron.txt and
    # LICENSES.chromium.html; these put them back in the Mac app's
    # resources under the same names, from the Electron `npm ci` pinned,
    # which the build fetches with `npx install-electron` (issue 108).
    # The afterPack hook refuses a package on either system without them.
    - from: node_modules/electron/dist/LICENSE
      to: LICENSE.electron.txt
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
# The disk image a person opens on a Mac: the brand background, the app and
# the Applications link placed on the two plates it draws. No `window` here
# on purpose - dmg-builder sizes the window from the background's own pixels
# and ignores a window block whenever a background is set (dmgUtil.js), so
# the art is the size, and the two positions below are points inside its
# 660x400. background.tiff carries both resolutions (`tiffutil
# -cathidpicheck`, which needs a Mac, and is why the TIFF is committed
# rather than built on the runner); the two PNGs beside it are the source.
dmg:
  icon: assets/brand/macos/icon.icns
  background: assets/brand/macos/background.tiff
  contents:
    - x: 165
      y: 200
    - x: 495
      y: 200
      type: link
      path: /Applications
win:
  target:
    - nsis
  icon: assets/brand/windows/icon.ico
  extraResources:
    - from: vendor/python/win-${arch}/python
      to: python
    - from: vendor/loom/win-${arch}
      to: loom
    - from: vendor/ffmpeg/win-${arch}
      to: ffmpeg
    - from: vendor/manifest-win-${arch}.json
      to: vendor-manifest.json
# An include and the three installer icons, and nothing else: the per-user
# one-click defaults stay, and with them the install folder,
# %LOCALAPPDATA%\Programs\<package name>, which
# .github/workflows/acceptance.yml derives and refuses to guess at if an
# option it has not been taught is set here (issue 140; a unit test holds
# this file to that workflow's own pattern, because the gate runs by hand
# against a published tag and would otherwise fail after the release). build/installer.nsh removes the copy of the
# installer electron-builder's template keeps for an updater this app does
# not have, right after it is made and again on uninstall (issue 128).
# build/installer.nsh is also electron-builder's default; it is named so the
# file is not a surprise.
#
# The icons below are the brand .ico, which carries the nine sizes Windows
# asks for down to 16px, the small ones without stations. The three branded
# bitmaps in assets/brand/windows/ (installer-sidebar, uninstaller-sidebar,
# installer-header) are deliberately not wired: NSIS draws them only on the
# assisted installer's pages, and `oneClick: false` would change how a
# person installs, what docs/acceptance.md describes, and what
# acceptance.yml's silent install exercises. Wiring them is its own issue.
nsis:
  include: build/installer.nsh
  installerIcon: assets/brand/windows/icon.ico
  uninstallerIcon: assets/brand/windows/icon.ico
  installerHeaderIcon: assets/brand/windows/icon.ico
